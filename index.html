<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>빠름빠름 전용앱 (테스트)</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00e5ff">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg: #000; --accent: #00e5ff; --text: #fff; --card: #1c1c1e; --error: #ff453a; --common: #ffd60a; }
    body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; }
    #top-zone { position: fixed; top: 0; left: 0; width: 100%; background: #111; border-bottom: 2px solid #333; padding: 10px 0; z-index: 99999; }
    .nav-bar { display: flex; justify-content: space-around; padding: 0 10px; margin-bottom: 10px; gap: 8px; }
    .nav-btn { background: #222; border: 2px solid var(--accent); color: var(--accent); padding: 10px 0; border-radius: 10px; font-size: 15px; font-weight: bold; flex: 1; cursor: pointer; text-align: center; pointer-events: auto; }
    .nav-btn.active { background: var(--accent); color: #000; }
    .radius-selector { display: flex; justify-content: center; gap: 4px; padding: 0 5px; }
    .rad-btn { background: #222; color: #777; border: 1px solid #444; font-size: 11px; padding: 8px 0; border-radius: 6px; font-weight: bold; cursor: pointer; width: 18%; text-align: center; pointer-events: auto; }
    .rad-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
    #content-area { position: absolute; top: 105px; bottom: 95px; left: 0; width: 100%; overflow-y: auto; padding: 10px; box-sizing: border-box; z-index: 1; -webkit-overflow-scrolling: touch; }
    
    /* 마이크 공간 제거 후 검색창을 꽉 차게 변경 */
    .search-wrap { display: none; margin-bottom: 10px; position: relative; }
    .search-bar { display: flex; gap: 8px; align-items: center; }
    .search-box { margin: 0; flex: 1 1 auto; min-width: 0; height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #444; background: #222; color: #fff; font-size: 16px; box-sizing: border-box; }
    .mic-btn { flex: 0 0 auto; height: 48px; box-sizing: border-box; padding: 0 16px; background: var(--accent); color: #000; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; white-space: nowrap; cursor: pointer; }
    .mic-btn.listening { background: #ff5a5a; color: #fff; animation: micPulse 1.2s infinite; }
    @keyframes micPulse { 0% { box-shadow: 0 0 0 0 rgba(255,60,60,.6); } 70% { box-shadow: 0 0 0 12px rgba(255,60,60,0); } 100% { box-shadow: 0 0 0 0 rgba(255,60,60,0); } }
    
    .list-item { background: var(--card); padding: 12px; border-radius: 12px; margin-bottom: 8px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; position: relative; }
    .list-item.near { border-color: var(--accent); background: #081214; }
    .dist-tag { position: absolute; top: 2px; left: 12px; font-size: 8px; color: var(--accent); font-weight: bold; }
    .apt-info { text-align: left; max-width: 60%; }
    .apt-name { font-size: 1.05em; font-weight: bold; color: var(--accent); }
    .apt-dong { font-size: 0.85em; color: #999; }
    .pw-info { text-align: right; }
    .pw-text { font-size: 1.3em; font-weight: 900; color: var(--error); letter-spacing: 0.5px; }
    .pw-text.common { color: var(--common); }
    #footer-zone { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; border-top: 2px solid #333; padding: 10px 0; text-align: center; z-index: 99999; }
    .app-title { font-size: 0.8em; font-weight: 900; color: var(--accent); border: 1px solid var(--accent); padding: 2px 15px; border-radius: 50px; display: inline-block; margin-bottom: 5px; }
    .legal-footer { color: var(--error); font-size: 10px; font-weight: bold; }
    .install-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); border-radius: 50px; font-size: 11px; padding: 4px 14px; margin-top: 6px; cursor: pointer; }
    .fab { position: fixed; bottom: 110px; right: 20px; width: 60px; height: 60px; background: var(--accent); border-radius: 50%; border: none; color: #000; font-size: 35px; font-weight: bold; z-index: 50000; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; }
    @media (display-mode: standalone) { #content-area { bottom: 65px; } .fab { bottom: 85px; } }
    .delete-btn { background: #222; color: var(--error); border: 2.5px solid var(--error); padding: 5px 12px; border-radius: 8px; font-size: 12px; margin-top: 8px; cursor: pointer; }
    
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100000; padding: 20px; box-sizing: border-box; }
    .modal-box { background: #1c1c1e; padding: 25px; border-radius: 20px; max-width: 450px; margin: 15% auto; text-align: center; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    input { width: 100%; padding: 14px; margin-top: 12px; background: #2c2c2e; border: 1px solid #444; border-radius: 12px; color: white; box-sizing: border-box; font-size: 16px; }
    #uni-pw-input { display: none; margin-bottom: 15px; text-align: center; font-size: 20px; letter-spacing: 10px; font-weight: bold; background: #111; color: var(--accent); border-color: var(--accent); }
    
    .gps-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
    .gps-status { display: none; position: sticky; top: 0; z-index: 2; background: #2a1c00; color: #ffb340; border: 1px solid #5a3d00; font-size: 12px; font-weight: bold; padding: 6px 10px; border-radius: 8px; margin-bottom: 8px; text-align: center; white-space: pre-line; }
    .latch-badge { background: #2a2400; border: 1.5px solid var(--common); color: var(--common); font-size: 13px; font-weight: bold; padding: 10px; border-radius: 10px; margin-bottom: 8px; text-align: center; cursor: pointer; }
    .approach-hint { color: #4a6a70; font-size: 12px; margin-top: 8px; }
    #gps-acc-msg { font-size: 13px; margin-top: 8px; white-space: pre-line; }
    .fchip-row { display:flex; gap:6px; margin-bottom:8px; }
    .fchip { flex:1; background:#222; color:#999; border:1px solid #444; border-radius:8px; padding:10px 0; font-size:13px; font-weight:bold; cursor:pointer; }
    .fchip.active { background:var(--accent); color:#000; border-color:var(--accent); }
    .rank-sec { color:var(--common); font-size:13px; font-weight:bold; margin:10px 0 6px 2px; }
    #snack-bar { display:none; position:fixed; bottom:110px; left:10px; right:10px; background:#1c1c1e; border:1.5px solid var(--accent); border-radius:12px; padding:12px; z-index:100001; text-align:center; font-size:14px; }
    #snack-bar button { margin:4px 4px 0 4px; padding:8px 16px; border-radius:8px; border:none; font-weight:bold; font-size:14px; cursor:pointer; }
    .snack-ok { background:var(--accent); color:#000; }
    .snack-no { background:#333; color:#fff; }
    .cold-card { background:#1c1c1e; border:1.5px solid var(--common); border-radius:12px; padding:16px; margin-bottom:10px; text-align:center; }
    .cold-status { color:#ffb340; font-size:13px; font-weight:bold; text-align:center; margin-bottom:10px; }
    .cold-sec { color:var(--accent); font-size:13px; font-weight:bold; margin:12px 0 6px 2px; }
    .chip-row { display:flex; flex-wrap:wrap; gap:6px; }
    .chip { background:#222; color:#fff; border:1px solid #444; border-radius:20px; padding:8px 14px; font-size:13px; cursor:pointer; }
    .chip small { color:#999; font-size:11px; }
    .cold-x { color:var(--common); font-weight:bold; padding:0 8px; cursor:pointer; }
    #cold-search { display:block; width:100%; }
    .row-btn { width: 45px; height: 45px; border-radius: 10px; border: 1.5px solid #444; background: #333; color: white; font-weight: bold; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <div id="top-zone">
    <div class="nav-bar">
      <button id="btn-main" class="nav-btn active" onclick="switchMode('main')">운행 모드</button>
      <button id="btn-manage" class="nav-btn" onclick="switchMode('manage')">검색</button>
    </div>
    <div class="radius-selector" id="radius-box">
      <button class="rad-btn" onclick="setRadius(20)">20m</button>
      <button class="rad-btn" onclick="setRadius(40)">40m</button>
      <button class="rad-btn" onclick="setRadius(60)">60m</button>
      <button class="rad-btn" onclick="setRadius(100)">100m</button>
      <button class="rad-btn" onclick="setRadius(200)">200m</button>
      <button class="rad-btn" onclick="setRadius(300)">300m</button>
    </div>
  </div>

  <div id="content-area">
    <div id="gps-status" class="gps-status"></div>
    <div id="search-wrap" class="search-wrap">
      <div class="search-bar">
      <input type="text" id="search-input" class="search-box" placeholder="아파트/동 검색" autocomplete="off" oninput="refreshDisplay()">
      <button type="button" id="mic-btn" class="mic-btn" style="display:none" aria-label="음성 검색">음성인식</button>
      </div>
    </div>
    <div id="list-container">
      <div id="loading-msg" style="color:#555; text-align:center; margin-top:80px;">📍 현재 위치를 확인 중입니다...</div>
    </div>
  </div>

  <div id="footer-zone">
    <div class="app-title">빠름빠름 전용앱</div>
    <div class="legal-footer">무단 배포 시 민·형사상 책임은 배포자 본인에게 있습니다.</div>
    <button id="install-btn" class="install-btn">홈화면에 설치</button>
  </div>

  <button class="fab" onclick="showAddModal()">+</button>
  <div id="snack-bar"></div>

  <div id="uni-modal" class="modal-overlay">
    <div class="modal-box">
      <div id="uni-msg" style="color:var(--accent); font-weight:bold; margin-bottom:20px; font-size: 1.1em; line-height: 1.5; white-space: pre-wrap;">알림</div>
      <input type="password" id="uni-pw-input" pattern="\d*" inputmode="numeric" placeholder="••••" maxlength="4" autocomplete="new-password">
      <div style="display:flex; gap:15px;">
        <button id="uni-no-btn" style="flex:1; padding:15px; border-radius:12px; border:none; background:#333; color:#fff; font-weight:bold; cursor:pointer;" onclick="closeUniModal()">취소</button>
        <button id="uni-ok-btn" style="flex:1; padding:15px; border-radius:12px; border:none; background:var(--accent); color:#000; font-weight:bold; cursor:pointer;">확인</button>
      </div>
    </div>
  </div>

  <div id="input-modal" class="modal-overlay">
    <div class="modal-box" style="overflow-y: auto; max-height: 90vh;">
      <h2 id="modal-title" style="color:var(--accent); margin:0 0 15px 0;">정보 관리</h2>
      <input type="hidden" id="edit-row">
      <input type="text" id="in-name" placeholder="아파트명" autocomplete="off">
      <input type="text" id="in-dong" placeholder="동/라인 (예: 101동 또는 공통)" autocomplete="off">
      <input type="text" id="in-pw" placeholder="비밀번호" autocomplete="off">
      <input type="text" id="in-addr" placeholder="주소" autocomplete="off">
      <div id="gps-container"></div>
      <button onclick="getGPS()" style="width:100%; padding:15px; background:#333; color:var(--accent); border:2px solid var(--accent); border-radius:12px; font-weight:bold; margin-top:20px;">📍 현위치 좌표 가져오기</button>
      <div id="gps-acc-msg"></div>
      <input type="text" id="in-note" placeholder="특이사항" autocomplete="off">
      <button onclick="saveData()" style="width:100%; padding:18px; background:var(--accent); border:none; border-radius:15px; font-weight:bold; font-size: 1.2em; margin-top:20px;">저장하기</button>
      <button onclick="hideInputModal()" style="width:100%; background:none; border:none; color:#8e8e93; margin-top:20px;">취소</button>
    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://saokvvmfdgybocpfamhl.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhb2t2dm1mZGd5Ym9jcGZhbWhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NDQ2NjAsImV4cCI6MjEwNzAyMDY2MH0.VDBrvAVaPBA89Iq56EGnaPV92iA96_UaJLphB5jLcCk';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let allData = [], myLat, myLon, currentMode = 'main', searchRadius = 40;
  let isGpsReady = false;
  let gpsTimeout;

  // ===== GPS 안정화 설정/상태 =====
  const GPS_OPTS = { enableHighAccuracy: true, timeout: 10000, maximumAge: 3000 };
  const ACC_WEAK = 30, ACC_REJECT = 80, ACC_COLLAPSE = 100, ACC_LATCH_EXIT = 25;
  const MAX_SPEED = 40, STALE_MS = 15000, LATCH_IDLE_MS = 8000, LATCH_MAX_MS = 15 * 60 * 1000;
  const HYST_MS = 20000, HYST_MIN_M = 15, RENDER_MIN_MOVE = 5, PREFETCH_R = 150;
  const GPS_ERR_MSG = { 1: '위치 권한 거부됨 — 설정에서 위치 권한을 허용해 주세요', 2: '위치 신호 없음 — 마지막 위치 유지 중', 3: '위치 응답 지연 — 마지막 위치 유지 중' };
  let watchId = null, myAcc = null, lastAcc = null, gpsErr = null;
  // ===== 래치 정확도 스코어링 (실측 튜닝 전 잠정치) =====
  const FIXBUF_N = 8, FIXBUF_WIN_MS = 10000, FIXBUF_GOOD_ACC = 30; // 실측 튜닝 전 잠정치 — P1 링버퍼: acc≤30m fix, 최대 8개, 10초 윈도우
  const VOTE_DECAY_MS = 5000;              // 실측 튜닝 전 잠정치 — 득표 시간감쇄 시상수
  const K_NEAREST = 3, K_PENALTY_M = 10, VALID_COORD_RATIO = 0.5; // 실측 튜닝 전 잠정치 — P2
  const DK_PTS_FULL = 30, DK_PTS_PART = 20, DK_MARGIN_FULL = 25, DK_MARGIN_PART = 15, DK_MARGIN_FALLBACK = 10; // 실측 튜닝 전 잠정치
  const VOTE_PTS_FULL = 25, VOTE_PTS_PART = 15, VOTE_FULL = 0.80, VOTE_PART = 0.70, VOTE_FALLBACK = 0.60, VOTE_GAP_FALLBACK = 0.20; // 실측 튜닝 전 잠정치
  const SPAN_PTS_FULL = 20, SPAN_PTS_PART = 15, SPAN_FULL = 180, SPAN_PART = 120, SPAN_FALLBACK = 90; // 실측 튜닝 전 잠정치
  const SPAN_R_M = 100;                    // 실측 튜닝 전 잠정치 — 방위각 전개폭 산정 반경
  const HEAD_PTS_FULL = 15, HEAD_PTS_PART = 8, HEAD_FULL = 0.7, HEAD_PART = 0.4, SPEED_SLOW_KMH = 5; // 실측 튜닝 전 잠정치
  const HEAD_MIN_MS = 1000;                // 실측 튜닝 전 잠정치 — 진행방향 산정 최소 시간폭
  const DWELL_PTS_FULL = 10, DWELL_PTS_PART = 5, DWELL_FULL_MS = 6000, DWELL_PART_MS = 4000; // 실측 튜닝 전 잠정치
  const SCORE_CUTOFF = 70, P5_BONUS = 10, CHALLENGER_MIN = 85; // 실측 튜닝 전 잠정치 — 100점 만점, P5 가점은 합계 100 cap
  const GOOD_FIX_ACC = 25, GOOD_FIX_MIN = 3;   // 실측 튜닝 전 잠정치 — 폴백 #4
  // ===== 콜드스타트 (실측 튜닝 전 잠정치) =====
  const COLD_ZONE_MS = 10 * 60 * 1000;     // 실측 튜닝 전 잠정치 — Zone A: 저장 후 10분 이내
  const COARSE_GATE_M = 300;               // 실측 튜닝 전 잠정치 — 복원 허용 최대 거리
  const COARSE_TIMEOUT_MS = 10000, COARSE_MAX_ACC = 800, COARSE_CHIP_N = 3; // 실측 튜닝 전 잠정치
  const COLD_SILENT_M = 60;                // 실측 튜닝 전 잠정치 — 무음 갱신 기준
  const SNACK_MS = 5000;                   // 실측 튜닝 전 잠정치 — 스낵바 자동 소멸
  const COLD_EXIT_STREAK = 3, COLD_EXIT_MOVE_M = 30; // 실측 튜닝 전 잠정치 — 지상 탈출 판정
  const RECENT_MAX = 10, RECENT_CHIP_N = 5; // 실측 튜닝 전 잠정치
  let lastGood = null, pendingJump = null;       // lastGood = {lat, lon, acc, t}
  let usingSavedPos = null;                      // GPS 미확보 시 사용 중인 저장 위치
  let latch = null, latchSuppressed = false;     // 지하 진입 고정 상태
  let shownKeys = new Set(), lastInAt = new Map(), lastShown = [], lastRender = null;
  let dataVer = 0, suppressNearFx = false;
  const prefetch = new Map();                    // 아파트명 -> 사전 준비된 동 목록
  let wakeLock = null, wakeWanted = false;
  let fixBuf = [];                 // P1: {lat, lon, acc, t} 링버퍼 (P4의 이동 trail 겸용)
  let coldChecked = false, coldView = null, coldDismissed = false, coldSaved = null;
  let coldAnchor = null, coldGoodStreak = 0;
  let snackTimer = null, snackName = null, snackMutedFor = null;
  let latchFilter = null;
  let coldNameList = [], coldRecentList = [], coldSearchList = [], coldCoarseList = [];

  window.onload = () => {
    const savedRad = localStorage.getItem('aptSearchRadius');
    if(savedRad) setRadius(parseInt(savedRad)); else setRadius(40);
    loadData();

    gpsTimeout = setTimeout(() => {
      isGpsReady = true;
      refreshDisplay();
    }, 2500);

    startWatch();
    setInterval(watchdog, 1000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        startWatch();
        if (wakeWanted) requestWakeLock();
      }
    });

    history.pushState({page: 'main'}, '', '');
  };

  function startWatch() {
    if (!navigator.geolocation) { onPosErr({ code: 2 }); return; }
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(onPos, onPosErr, GPS_OPTS);
  }

  function onPos(p) {
    const c = p.coords, now = Date.now();
    const lat = c.latitude, lon = c.longitude;
    const acc = Number.isFinite(c.accuracy) ? c.accuracy : 999;
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
    gpsErr = null; lastAcc = acc;
    if (acc > ACC_COLLAPSE) maybeLatch();
    if (acc > ACC_REJECT) { updateStatus(); return; }   // 정확도 불량: 위치 갱신 거부

    // 순간이동 거부: 비정상 속도면 보류, 연속 2회 같은 지점이면 확정
    // 보류 중에는 점프 직전 마지막 신뢰 위치 기준으로 해당 단지 전체 동을 표시
    if (lastGood) {
      const dt = Math.max((now - lastGood.t) / 1000, 1);
      if (distM(lastGood.lat, lastGood.lon, lat, lon) / dt > MAX_SPEED) {
        if (pendingJump && distM(pendingJump.lat, pendingJump.lon, lat, lon) <= Math.max(30, acc, pendingJump.acc)) {
          if (++pendingJump.count < 2) { updateStatus(); return; }
        } else {
          pendingJump = { lat, lon, acc, count: 0 };
          if (!latch || latch.kind !== 'jump') holdJumpComplex();
          updateStatus(); return;
        }
      }
    }
    if (pendingJump && latch && latch.kind === 'jump') latch = null;  // 점프 확정/기각: 확장 해제
    pendingJump = null;
    acceptPos(lat, lon, acc, now);
  }

  function acceptPos(lat, lon, acc, t) {
    if (latch && latch.kind === 'cold' && !coldDismissed) {
      if (acceptPosCold(lat, lon, acc, t)) return;  // true=콜드 모드 유지
      // false=지상 탈출 → 아래 일반 처리로 폴스루
    }
    myLat = lat; myLon = lon; myAcc = acc;
    lastGood = { lat, lon, acc, t };
    usingSavedPos = null; latchSuppressed = false; coldView = null;
    pushFixBuf(lat, lon, acc, t);
    saveGoodComplex(lat, lon, acc, t);
    try { localStorage.setItem('last_good_pos', JSON.stringify({ lat, lon, t })); } catch (e) {}
    if (!isGpsReady) { clearTimeout(gpsTimeout); isGpsReady = true; }
    if (latch && acc <= ACC_LATCH_EXIT) latch = null;
    updateStatus();
    refreshDisplay();
  }

  // 콜드 복원 화면 유지 중 위치 수신: 화면은 고정, 탈출 조건 충족 시 false
  function acceptPosCold(lat, lon, acc, t) {
    myLat = lat; myLon = lon; myAcc = acc;
    lastGood = { lat, lon, acc, t };
    usingSavedPos = null;
    pushFixBuf(lat, lon, acc, t);
    try { localStorage.setItem('last_good_pos', JSON.stringify({ lat, lon, t })); } catch (e) {}
    if (!isGpsReady) { clearTimeout(gpsTimeout); isGpsReady = true; }
    updateStatus();
    const cur = latch.names[0];
    const dCur = complexMinDist(cur, lat, lon);
    if (acc <= ACC_LATCH_EXIT) coldGoodStreak++; else coldGoodStreak = 0;
    if (!coldAnchor) coldAnchor = { lat, lon };
    // 지상 탈출: 양호 fix 연속 + 이동 + 표시 단지와 일치 → 자동 해제 후 일반 모드 복귀
    if (coldGoodStreak >= COLD_EXIT_STREAK && dCur <= searchRadius &&
        distM(lat, lon, coldAnchor.lat, coldAnchor.lon) > COLD_EXIT_MOVE_M) {
      return false;
    }
    if (dCur <= COLD_SILENT_M) {
      const el = document.getElementById('cold-badge-txt');
      if (el) el.textContent = '🕘 ' + fmtAgo(Date.now() - (latch.savedT || latch.since)) + ' 위치 기준 — 현위치 아님';
    } else {
      let best = null, bestD = 999999;
      complexNames().forEach(n => { const d = complexMinDist(n, lat, lon); if (d < bestD) { bestD = d; best = n; } });
      if (best && best !== snackMutedFor) { snackName = best; showColdSnack(best); }
    }
    return true;
  }

  // 양호 위치에서 표시 중인 단지 저장 (콜드스타트 복원용)
  function saveGoodComplex(lat, lon, acc, t) {
    const cnt = new Map(), addrOf = new Map();
    (lastShown || []).forEach(r => {
      if (!r || !r.item || !r.near) return;
      const n = String(r.item.name || '');
      if (!n) return;
      cnt.set(n, (cnt.get(n) || 0) + 1);
      if (!addrOf.get(n) && r.item.addr) addrOf.set(n, r.item.addr);
    });
    let name = null, best = 0;
    cnt.forEach((c, n) => { if (c > best) { best = c; name = n; } });
    if (!name) return;
    try {
      localStorage.setItem('last_good_complex', JSON.stringify({ name, lat, lon, t, acc }));
      saveRecent(name, addrOf.get(name) || '');
    } catch (e) {}
  }
  function getSavedComplex() {
    try {
      const s = JSON.parse(localStorage.getItem('last_good_complex') || 'null');
      if (s && s.name && Number.isFinite(s.lat) && Number.isFinite(s.lon) && Number.isFinite(s.t)) return s;
    } catch (e) {}
    return null;
  }
  function getRecents() {
    try {
      const a = JSON.parse(localStorage.getItem('recent_complexes') || '[]');
      return Array.isArray(a) ? a.filter(r => r && r.name) : [];
    } catch (e) { return []; }
  }
  function saveRecent(name, addr) {
    if (!name) return;
    const list = getRecents().filter(r => r.name !== name);
    list.unshift({ name, addr: addr || '' });
    try { localStorage.setItem('recent_complexes', JSON.stringify(list.slice(0, RECENT_MAX))); } catch (e) {}
  }

  // 콜드 복원 중 다른 단지 감지 스낵바
  function showColdSnack(name) {
    const el = document.getElementById('snack-bar');
    if (!el) return;
    if (el.style.display === 'block' && el.dataset.name === name) return;  // 같은 단지 표시 중이면 타이머 유지 (매 fix마다 연장 방지)
    el.dataset.name = name;
    el.innerHTML = `📍 현위치 ${esc(name)} 감지됨 — 화면을 변경할까요?<br><button class="snack-ok" onclick="coldSnackChange()">변경</button><button class="snack-no" onclick="hideColdSnack()">유지</button>`;
    el.style.display = 'block';
    clearTimeout(snackTimer);
    snackTimer = setTimeout(hideColdSnack, SNACK_MS);
  }
  function hideColdSnack() {
    const el = document.getElementById('snack-bar');
    if (el) { el.style.display = 'none'; el.dataset.name = ''; }
    clearTimeout(snackTimer); snackTimer = null;
    snackMutedFor = snackName;
  }
  function coldSnackChange() {
    hideColdSnack();
    latch = null; coldAnchor = null; coldGoodStreak = 0; latchFilter = null; coldView = null;
    lastRender = null;
    updateStatus();
    refreshDisplay();
  }

  function onPosErr(e) {
    gpsErr = (e && e.code) || 2;
    maybeLatch();
    if (!isGpsReady) { clearTimeout(gpsTimeout); isGpsReady = true; refreshDisplay(); }
    updateStatus();
  }

  // 1초 감시: 끊김 배너, 지하 고정 진입/만료, 이탈 지연 항목 정리
  function watchdog() {
    const now = Date.now();
    if (latch && now - latch.since > LATCH_MAX_MS) releaseLatch(true);
    else if (lastGood && now - lastGood.t > LATCH_IDLE_MS) maybeLatch();
    if (currentMode === 'main' && !latch && lastShown.some(r => !r.near)) refreshDisplay();
    updateStatus();
  }

  // 동 정렬: 숫자 우선 자연 정렬 ("101동" < "119동" < "공통")
  function cmpDong(a, b) {
    return String(a.dong || '').localeCompare(String(b.dong || ''), 'ko', { numeric: true });
  }

  // ===== 래치 정확도: 단지 후보 스코어링 (순수 함수) =====
  function itemCoords(item) {
    if (!item || !item.lat) return [];
    const lats = String(item.lat).split('|'), lons = String(item.lon).split('|'), out = [];
    lats.forEach((lt, idx) => {
      const a = parseFloat(lt), o = parseFloat(lons[idx]);
      if (Number.isFinite(a) && Number.isFinite(o)) out.push({ lat: a, lon: o });
    });
    return out;
  }
  function complexNames() {
    const seen = new Set();
    (allData || []).forEach(i => { const n = String(i.name || ''); if (n) seen.add(n); });
    return [...seen];
  }
  function complexItems(name) {
    return (allData || []).filter(i => String(i.name) === name);
  }
  function complexValidRatio(name) {
    const items = complexItems(name);
    if (!items.length) return 0;
    return items.filter(i => itemCoords(i).length > 0).length / items.length;
  }
  function distToItem(item, lat, lon) {
    return getDist(item.lat, item.lon, lat, lon);
  }
  function complexMinDist(name, lat, lon) {
    let minD = 999999;
    complexItems(name).forEach(i => { const d = distToItem(i, lat, lon); if (d < minD) minD = d; });
    return minD;
  }
  function dKAvg(name, lat, lon) {
    const ds = complexItems(name).filter(i => itemCoords(i).length > 0)
      .map(i => distToItem(i, lat, lon)).sort((a, b) => a - b).slice(0, K_NEAREST);
    if (!ds.length) return { avg: 999999, n: 0 };
    const avg = ds.reduce((s, d) => s + d, 0) / ds.length;
    return { avg: ds.length < K_NEAREST ? avg + K_PENALTY_M : avg, n: ds.length };
  }
  function complexCentroid(name) {
    let sLat = 0, sLon = 0, n = 0;
    complexItems(name).forEach(i => itemCoords(i).forEach(c => { sLat += c.lat; sLon += c.lon; n++; }));
    return n ? { lat: sLat / n, lon: sLon / n } : null;
  }
  // 기준점에서 반경 SPAN_R_M 내 단지 건물들을 바라보는 방위각 전개폭(도)
  function bearingSpan(name, lat, lon) {
    const cosLat = Math.cos(lat * Math.PI / 180), bs = [];
    complexItems(name).forEach(i => itemCoords(i).forEach(c => {
      if (distM(lat, lon, c.lat, c.lon) > SPAN_R_M) return;
      let b = Math.atan2((c.lon - lon) * cosLat, c.lat - lat) * 180 / Math.PI;
      if (b < 0) b += 360;
      bs.push(b);
    }));
    if (bs.length < 2) return 0;
    bs.sort((a, b) => a - b);
    let maxGap = bs[0] + 360 - bs[bs.length - 1];
    for (let k = 1; k < bs.length; k++) maxGap = Math.max(maxGap, bs[k] - bs[k - 1]);
    return 360 - maxGap;
  }
  function pushFixBuf(lat, lon, acc, t) {
    if (!(acc <= FIXBUF_GOOD_ACC)) return;
    fixBuf.push({ lat, lon, acc, t });
    fixBuf = fixBuf.filter(f => t - f.t <= FIXBUF_WIN_MS).slice(-FIXBUF_N);
  }
  // 각 fix가 최근접 단지에 (1/acc)*exp(-age/VOTE_DECAY_MS) 가중 투표 (age 기준 = 최신 fix 시각)
  function voteComplexes() {
    if (!fixBuf.length) return [];
    const tRef = fixBuf[fixBuf.length - 1].t, names = complexNames(), votes = new Map();
    let total = 0;
    fixBuf.forEach(f => {
      let best = null, bestD = 999999;
      names.forEach(n => { const d = complexMinDist(n, f.lat, f.lon); if (d < bestD) { bestD = d; best = n; } });
      if (!best) return;
      const w = (1 / Math.max(f.acc, 1)) * Math.exp(-(tRef - f.t) / VOTE_DECAY_MS);
      votes.set(best, (votes.get(best) || 0) + w);
      total += w;
    });
    const out = [];
    votes.forEach((v, name) => out.push({ name, votes: v, share: total > 0 ? v / total : 0 }));
    return out.sort((a, b) => b.share - a.share);
  }
  // 이동 방향(처음→마지막 fix)과 최신 fix→단지중심 방향의 cos. 판정 불가 시 null
  function headingCos(name) {
    if (fixBuf.length < 2) return null;
    const f0 = fixBuf[0], f1 = fixBuf[fixBuf.length - 1];
    const dt = f1.t - f0.t;
    if (dt < HEAD_MIN_MS) return null;
    const cosLat = Math.cos(f1.lat * Math.PI / 180);
    const mx = (f1.lon - f0.lon) * 111000 * cosLat, my = (f1.lat - f0.lat) * 111000;
    const mv = Math.hypot(mx, my);
    if (mv / (dt / 1000) * 3.6 < SPEED_SLOW_KMH) return null;
    const c = complexCentroid(name);
    if (!c) return null;
    const cx = (c.lon - f1.lon) * 111000 * cosLat, cy = (c.lat - f1.lat) * 111000;
    const cv = Math.hypot(cx, cy);
    if (cv === 0) return null;
    return (mx * cx + my * cy) / (mv * cv);
  }
  function dwellMs() {
    return fixBuf.length < 2 ? 0 : fixBuf[fixBuf.length - 1].t - fixBuf[0].t;
  }
  function activeComplex(items) {
    const cnt = new Map();
    (items || lastShown || []).forEach(r => {
      const n = r && r.item ? String(r.item.name || '') : '';
      if (n) cnt.set(n, (cnt.get(n) || 0) + 1);
    });
    let best = null, bestC = 0;
    cnt.forEach((c, n) => { if (c > bestC) { bestC = c; best = n; } });
    return best;
  }
  function scoreComplexes(names, lat, lon) {
    const voteMap = new Map(voteComplexes().map(v => [v.name, v.share]));
    const dwell = dwellMs();
    const base = names.map(name => ({ name, dkAvg: dKAvg(name, lat, lon).avg }));
    const byD = [...base].sort((a, b) => a.dkAvg - b.dkAvg);
    const leadGap = byD.length > 1 ? byD[1].dkAvg - byD[0].dkAvg : 999;
    return base.map(b => {
      const deltaD = b.name === byD[0].name ? leadGap : 0;  // 1위가 아니면 거리 마진 0점
      const share = voteMap.get(b.name) || 0;
      const span = bearingSpan(b.name, lat, lon);
      const head = headingCos(b.name);
      const pDk = deltaD >= DK_MARGIN_FULL ? DK_PTS_FULL : deltaD >= DK_MARGIN_PART ? DK_PTS_PART : 0;
      // 득표 60~69% 구간은 0점이지만 폴백이 아님 — 다른 신호 만점으로 70점 도달 가능 (의도된 동작)
      const pVote = share >= VOTE_FULL ? VOTE_PTS_FULL : share >= VOTE_PART ? VOTE_PTS_PART : 0;
      const pSpan = span >= SPAN_FULL ? SPAN_PTS_FULL : span >= SPAN_PART ? SPAN_PTS_PART : 0;
      const pHead = head == null ? 0 : head >= HEAD_FULL ? HEAD_PTS_FULL : head >= HEAD_PART ? HEAD_PTS_PART : 0;  // 저속 시 0점, 재배분 없음
      const pDwell = dwell >= DWELL_FULL_MS ? DWELL_PTS_FULL : dwell >= DWELL_PART_MS ? DWELL_PTS_PART : 0;
      return {
        name: b.name, score: pDk + pVote + pSpan + pHead + pDwell,
        parts: { dk: pDk, vote: pVote, span: pSpan, head: pHead, dwell: pDwell },
        dkAvg: b.dkAvg, voteShare: share, span, validRatio: complexValidRatio(b.name)
      };
    });
  }
  // 폴백(상위 2개 동시 표시) 사유 | null. scored: 점수 내림차순(P5 적용 후), 최소 2개
  function checkFallbacks(scored, deltaD, lat, lon) {
    const s0 = scored[0], s1 = scored[1];
    if ((s0.voteShare || 0) < VOTE_FALLBACK || (s0.voteShare - s1.voteShare) < VOTE_GAP_FALLBACK) return 'vote';
    if (deltaD < DK_MARGIN_FALLBACK) return 'margin';
    const good = fixBuf.filter(f => f.acc <= FIXBUF_GOOD_ACC);
    if (good.length >= 1 && good.every(f =>
        complexMinDist(s0.name, f.lat, f.lon) <= f.acc && complexMinDist(s1.name, f.lat, f.lon) <= f.acc)) return 'accuracy';
    if (fixBuf.filter(f => f.acc <= GOOD_FIX_ACC).length < GOOD_FIX_MIN) return 'fewfix';
    if (s0.validRatio < VALID_COORD_RATIO || s1.validRatio < VALID_COORD_RATIO) return 'badratio';
    if (s0.span < SPAN_FALLBACK && s1.span < SPAN_FALLBACK) return 'span';
    return null;
  }
  function rankComplexes(names, lat, lon) {
    const uniq = [...new Set(names.filter(Boolean))];
    if (uniq.length <= 1) return { mode: 'single', ordered: uniq, scores: [], reason: null };
    let scored = scoreComplexes(uniq, lat, lon);
    const active = activeComplex(lastShown);
    const activeIn = !!(active && uniq.includes(active));
    scored.forEach(s => { if (activeIn && s.name === active) s.score = Math.min(100, s.score + P5_BONUS); }); // P5는 가점만. renderMain 진입 로직 변경 금지
    scored.sort((a, b) => b.score - a.score || a.dkAvg - b.dkAvg);
    const byD = [...scored].sort((a, b) => a.dkAvg - b.dkAvg);
    const deltaD = byD.length > 1 ? byD[1].dkAvg - byD[0].dkAvg : 999;
    const fb = checkFallbacks(scored, deltaD, lat, lon);
    if (fb) return { mode: 'dual', ordered: [scored[0].name, scored[1].name], scores: scored, reason: fb };
    const top = scored[0];
    if (top.score < SCORE_CUTOFF) return { mode: 'dual', ordered: [top.name, scored[1].name], scores: scored, reason: 'cutoff' };
    if (activeIn && top.name !== active) {
      if (top.score >= CHALLENGER_MIN) return { mode: 'single', ordered: [top.name], scores: scored, reason: 'challenger-win' };
      return { mode: 'dual', ordered: [active, top.name], scores: scored, reason: 'challenger-hold' }; // 폴백 #7
    }
    return { mode: 'single', ordered: [top.name], scores: scored, reason: null };
  }
  // 저정밀(coarse) 위치의 오차원 안에 건물이 들어오는 단지 후보 (가까운 순)
  function coarseCandidates(lat, lon, acc) {
    return complexNames()
      .map(name => ({ name, d: complexMinDist(name, lat, lon) }))
      .filter(c => c.d <= acc)
      .sort((a, b) => a.d - b.d)
      .slice(0, COARSE_CHIP_N);
  }

  // latch 표시 목록 확장 (순수 함수)
  // allData: 전체 행 [{id, name, dong, ...}], nearbyItems: latch 직전 화면 행 [{item, d, near}] (거리순 정렬됨),
  // refPos: {lat, lon} | null — nearbyItems가 비었을 때 300m 폴백용
  // 반환: { rows: [{item, d, near}], names: [apt_name...], rank: rankComplexes 결과 | null }
  function expandComplex(allData, nearbyItems, refPos) {
    const seen = new Set();
    let names = [];
    const near = (nearbyItems || []).filter(r => r && r.item && r.near);
    near.forEach(r => {
      const n = String(r.item.name || '');
      if (n && !seen.has(n)) { seen.add(n); names.push(n); }
    });
    // 폴백: 표시 목록이 비었으면 마지막 위치 기준 300m 이내 건물에서 단지명 수집
    if (names.length === 0 && refPos && Number.isFinite(refPos.lat) && Number.isFinite(refPos.lon) && Array.isArray(allData)) {
      allData.forEach(item => {
        if (getDist(item.lat, item.lon, refPos.lat, refPos.lon) <= 300) {
          const n = String(item.name || '');
          if (n && !seen.has(n)) { seen.add(n); names.push(n); }
        }
      });
    }
    if (names.length === 0) return { rows: [], names: [], rank: null };
    // 후보 2개 이상: 스코어링으로 1개 확정 또는 상위 2개(dual)로 캡
    let rank = null;
    const posOk = refPos && Number.isFinite(refPos.lat) && Number.isFinite(refPos.lon);
    if (names.length >= 2 && posOk) {
      rank = rankComplexes(names, refPos.lat, refPos.lon);
      names = rank.ordered; // dual이어도 최대 2개로 캡
    }
    // 래치 표시: 단지별 그룹 + 동 번호 오름차순 (101동부터). 가까운 동 거리순 우선은 적용하지 않음.
    const nearById = new Map(near.map(r => [r.item.id, r]));
    const rows = [];
    names.forEach(n => {
      allData
        .filter(item => String(item.name || '') === n)
        .sort(cmpDong)
        .forEach(item => {
          const prev = nearById.get(item.id);
          rows.push({ item, d: prev ? prev.d : (posOk ? getDist(item.lat, item.lon, refPos.lat, refPos.lon) : 999999), near: !!prev });
        });
    });
    return { rows, names, rank };
  }

  // 점프 보류 중 표시: 점프 직전 마지막 신뢰 위치 기준으로 해당 단지 전체 동 표시
  function holdJumpComplex() {
    if (latch && latch.kind === 'cold') return;  // CP3: 콜드 복원 화면 보호
    if (currentMode !== 'main' || !lastGood) return;
    const exp = expandComplex(allData, lastShown, { lat: lastGood.lat, lon: lastGood.lon });
    latch = exp.names.length > 0
      ? { items: exp.rows, names: exp.names, since: Date.now(), kind: 'jump', rank: exp.rank || null }
      : { items: lastShown.slice(), names: [], since: Date.now(), kind: 'jump', rank: null };
    latchFilter = null;
    refreshDisplay();
  }

  // 단지 반경 안에 머무는 중일 때만 현재 표시된 카드 고정 (확장: 해당 단지 전체 동)
  function maybeLatch() {
    if (latch || latchSuppressed || currentMode !== 'main' || !lastGood) return;
    if (!lastShown.some(r => r.near)) return;
    const exp = expandComplex(allData, lastShown, { lat: myLat, lon: myLon });
    latch = exp.names.length > 0
      ? { items: exp.rows, names: exp.names, since: Date.now(), kind: 'signal', rank: exp.rank || null }
      : { items: lastShown.slice(), names: [], since: Date.now(), kind: 'signal', rank: null };
    latchFilter = null;
    refreshDisplay();
  }

  function releaseLatch(manual) {
    latch = null;
    if (manual) latchSuppressed = true;   // 새 위치가 들어올 때까지 재고정 안 함
    lastRender = null;
    refreshDisplay();
    updateStatus();
  }

  function getSavedPos() {
    try {
      const s = JSON.parse(localStorage.getItem('last_good_pos') || 'null');
      if (s && Number.isFinite(s.lat) && Number.isFinite(s.lon)) return s;
    } catch (e) {}
    return null;
  }

  function fmtAgo(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + '초 전';
    if (s < 3600) return Math.round(s / 60) + '분 전';
    return Math.round(s / 3600) + '시간 전';
  }

  function updateStatus() {
    const el = document.getElementById('gps-status');
    if (!el) return;
    const msgs = [], now = Date.now();
    if (currentMode === 'main') {
      const stale = lastGood && now - lastGood.t > STALE_MS;
      if (gpsErr) msgs.push(GPS_ERR_MSG[gpsErr] || '위치 오류');
      if (stale) msgs.push(`GPS 끊김 · ${Math.round((now - lastGood.t) / 1000)}초 전 위치 기준`);
      else if (usingSavedPos) msgs.push(`이전 위치 기준 (${fmtAgo(now - usingSavedPos.t)})`);
      if (!gpsErr && !stale && lastAcc != null && lastAcc > ACC_WEAK) msgs.push(`신호 약함 (±${Math.round(lastAcc)}m)` + (lastAcc > ACC_REJECT ? ' · 위치 갱신 보류' : ''));
      if (pendingJump) msgs.push('위치 급변 감지 · 확인 중');
    }
    const txt = msgs.join('\n');
    if (el.textContent !== txt) el.textContent = txt;
    el.style.display = txt ? 'block' : 'none';
  }

  async function requestWakeLock() {
    wakeWanted = true;
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');

  function levenshtein(a, b) {
    let m = [], i, j, min = Math.min;
    if (!(a && b)) return (b || a).length;
    for (i = 0; i <= b.length; m[i] = [i++]);
    for (j = 0; j <= a.length; m[0][j] = j++);
    for (i = 1; i <= b.length; i++) {
      for (j = 1; j <= a.length; j++) {
        m[i][j] = b.charAt(i - 1) == a.charAt(j - 1) ? m[i - 1][j - 1] : m[i][j] = min(m[i - 1][j - 1] + 1, min(m[i][j - 1] + 1, m[i - 1][j] + 1));
      }
    }
    return m[b.length][a.length];
  }

  // 글자 오타 교정 스코어 계산 (100% 일치 실패 시에만 호출됨)
  // 한글 음절 → 초성 (원문 인덱스와 1:1 대응)
  const CHOSUNG = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  function getChosung(s) {
    let out = '';
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i) - 44032;
      out += (c >= 0 && c < 11172) ? CHOSUNG[Math.floor(c / 588)] : s[i];
    }
    return out;
  }

  // [2단계] 토큰 순서 매칭: "펜타 한신 2차" → "펜타시티 한신더휴 2차" (중간 단어 생략 허용)
  function tokenSubseqScore(rawQuery, item) {
    const tokens = String(rawQuery).toLowerCase().split(/\s+/).filter(t => t.length > 0);
    if (tokens.length < 2) return 0;
    const target = (item.name + ' ' + item.dong + ' ' + item.addr).toLowerCase();
    let pos = 0;
    for (const tk of tokens) {
      const idx = target.indexOf(tk, pos);
      if (idx < 0) return 0;
      pos = idx + tk.length;
    }
    return 40 + tokens.length * 5;
  }

  // [3단계] 초성 매칭: "ㅍㅌㅅㅌ" → "펜타시티"
  function chosungScore(rawQuery, item) {
    const q = String(rawQuery).replace(/\s+/g, '');
    if (!q || !/^[ㄱ-ㅎ]+$/.test(q)) return 0;
    const target = getChosung(String(item.name + item.dong).replace(/\s+/g, ''));
    const idx = target.indexOf(q);
    return idx < 0 ? 0 : (idx === 0 ? 35 : 30);
  }

  function getMatchScore(query, item) {
    const itemName = String(item.name || '');
    const itemDong = String(item.dong || '');
    const nameDongStr = (itemName + itemDong).toLowerCase().replace(/\s+/g, "");
    const targetStr = (itemName + itemDong + String(item.addr || '')).toLowerCase().replace(/\s+/g, "");
    const nameStr = itemName.toLowerCase().replace(/\s+/g, "");

    // [4단계] 오타 보정 — "N단지"/"N차" 지정이 있으면 이름 기준으로 엄격 판정
    const qDesig = query.match(/(\d+)(단지|차)/);
    if (qDesig) {
      const nDesig = nameStr.match(/(\d+)(단지|차)/);
      if (nDesig && nDesig[1] !== qDesig[1]) return 0;  // "2단지" 쿼리에 "1단지"는 제외
      if (!nameStr.includes(qDesig[1])) return 0;        // 이름에 숫자 자체가 없으면 제외 (동/주소의 숫자는 안 됨)
    } else {
      // 숫자가 틀리면 무조건 탈락 (오타 검사 제외)
      const queryNums = query.match(/\d+/g);
      if (queryNums) {
        for (let i = 0; i < queryNums.length; i++) {
          if (!targetStr.includes(queryNums[i])) return 0;
        }
      }
    }

    // "대박2단지" → "대박" (단지/차 접미사는 이름 매칭에서 제외)
    const queryLetters = query.replace(/\d+/g, "").replace(/(단지|차)+$/, "");
    if (queryLetters.length < 2) return 0; // 한 글자는 오타 검사 안 함

    const len = queryLetters.length;
    const maxErr = len <= 3 ? 1 : 2;
    let bestDist = 999;

    if (len <= 2) {
      // 짧은 쿼리는 단어 시작 위치에서만 매칭 ("대박"→"대방" O, "대박"→"현대아이파크 속 대아" X)
      const words = (itemName + ' ' + itemDong).toLowerCase().split(/\s+/)
        .map(w => w.replace(/\d+/g, "").replace(/(단지|차)/g, ""))
        .filter(w => w.length >= len);
      for (const w of words) {
        const dist = levenshtein(queryLetters, w.substr(0, len));
        if (dist < bestDist) bestDist = dist;
      }
    } else {
      // 이름+동 안에서만 매칭 (주소는 제외 — 주소 오타 매칭이 쓰레기 결과의 주범)
      const targetLetters = nameDongStr.replace(/\d+/g, "").replace(/(단지|차)/g, "");
      if (len <= targetLetters.length) {
        for (let i = 0; i <= targetLetters.length - len; i++) {
          const dist = levenshtein(queryLetters, targetLetters.substr(i, len));
          if (dist < bestDist) bestDist = dist;
        }
      }
    }

    if (bestDist <= maxErr) {
      return 50 - bestDist;
    }
    return 0;
  }


  // 음성 검색: SpeechRecognition 지원 브라우저에서만 마이크 버튼 노출
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) document.getElementById('mic-btn').style.display = 'block';
  let rec = null, recListening = false;

  function setMicListening(on) {
    recListening = on;
    document.getElementById('mic-btn').classList.toggle('listening', on);
  }

  function toggleVoice() {
    if (recListening) { try { rec.stop(); } catch (e) {} setMicListening(false); return; }
    const input = document.getElementById('search-input');
    rec = new SR();
    rec.lang = 'ko-KR'; rec.interimResults = true; rec.maxAlternatives = 1;
    rec.onresult = (ev) => {
      let finalT = '', interim = '';
      for (let i = 0; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) finalT += ev.results[i][0].transcript;
        else interim += ev.results[i][0].transcript;
      }
      input.value = finalT + interim;
      if (!interim && finalT) {
        input.value = finalT.trim();
        input.focus(); refreshDisplay();
      }
    };
    rec.onerror = (e) => {
      setMicListening(false);
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') showMsg('설정에서 마이크 권한을 허용해 주세요');
      else if (e.error === 'no-speech') showMsg('음성이 감지되지 않았어요');
      else if (e.error !== 'aborted') showMsg('음성 인식 오류: ' + e.error);
    };
    const r = rec;   // 빠르게 재시작 시 이전 인스턴스의 늦은 onend가 새 인스턴스를 지우지 않게
    rec.onend = () => { if (rec !== r) return; setMicListening(false); rec = null; };
    try { rec.start(); setMicListening(true); } catch (e) { setMicListening(false); }
  }
  document.getElementById('mic-btn').addEventListener('click', toggleVoice);

  // PWA 홈 화면 설치
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
  document.getElementById('install-btn').addEventListener('click', async () => {
    if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; }
    else { showMsg('Android: ⋮ 메뉴 → 홈 화면에 추가 / iPhone: 공유 버튼 → 홈 화면에 추가'); }
  });
  if (window.matchMedia('(display-mode: standalone)').matches) { document.getElementById('install-btn').style.display = 'none'; }

  function refreshDisplay() {
    const container = document.getElementById('list-container');
    const searchVal = document.getElementById('search-input').value.toLowerCase().replace(/\s+/g, "");
    
    if (!allData || allData.length === 0) return;

    let filtered = [];
    if (currentMode === 'main') {
      renderMain(container);
      return;
    } else {
      if (searchVal) {
        // [1단계 필터] 검색어와 100% 완벽하게 일치하는 데이터 먼저 탐색
        let exactMatches = allData.filter(i => {
          const targetStr = (i.name + i.dong + i.addr).toLowerCase().replace(/\s+/g, "");
          return targetStr.includes(searchVal);
        });

        if (exactMatches.length > 0) {
          // 정확히 일치하는 데이터(포레나 101동)가 발견되면, 오타 알고리즘(샬레 101동) 가동 완전 차단
          filtered = exactMatches.sort((a,b) => a.name.localeCompare(b.name));
        } else {
          // [2단계] 토큰 순서 매칭("펜타 한신 2차"→"펜타시티 한신더휴 2차") → [3단계] 초성 → [4단계] 오타 보정
          const rawQuery = document.getElementById('search-input').value;
          const tiers = [
            allData.map(i => ({ item: i, score: tokenSubseqScore(rawQuery, i) })),
            allData.map(i => ({ item: i, score: chosungScore(rawQuery, i) })),
            allData.map(i => ({ item: i, score: getMatchScore(searchVal, i) })),
          ];
          let scoredItems = [];
          for (const t of tiers) {
            scoredItems = t.filter(h => h.score > 0);
            if (scoredItems.length) break;
          }

          scoredItems.sort((a, b) => {
            if (b.score !== a.score) return b.score - a.score;
            return a.item.name.localeCompare(b.item.name);
          });

          filtered = scoredItems.map(d => d.item);
        }
      } else {
        filtered = [...allData].sort((a,b) => a.name.localeCompare(b.name));
      }
    }
    
    lastRender = null;
    const hasFix = Number.isFinite(myLat) && Number.isFinite(myLon);
    const rows = filtered.map(item => {
      const d = hasFix ? getDist(item.lat, item.lon) : 999999;
      return { item, d, near: hasFix && d <= searchRadius };
    });
    if (rows.length === 0) {
      container.innerHTML = `<div style="color:#555; text-align:center; margin-top:50px;">${searchVal ? '검색 결과가 없습니다.' : '주변 ' + searchRadius + 'm 이내 없음'}</div>`;
    } else {
      container.innerHTML = rows.map(r => cardHtml(r, true)).join('');
    }
  }

  // ===== 콜드스타트: GPS 미확보 상태에서 저장 단지 복원 / 단지 선택 =====
  function coldBootCheck() {
    coldChecked = true;
    if (!allData || allData.length === 0) { coldView = { type: 'hybrid', coarsePending: false, needData: true }; return; }
    coldView = { type: 'hybrid', coarsePending: true, coarseCands: [] };
    const saved = getSavedComplex();
    coldSaved = (saved && !coldDismissed && (Date.now() - saved.t) <= COLD_ZONE_MS) ? saved : null;
    if (navigator.geolocation) {
      try {
        navigator.geolocation.getCurrentPosition(onColdCoarseOk, onColdCoarseErr,
          { enableHighAccuracy: false, timeout: COARSE_TIMEOUT_MS, maximumAge: 60000 });
        return;
      } catch (e) {}
    }
    onColdCoarseErr();
  }
  function onColdCoarseOk(p) {
    if (latch || (Number.isFinite(myLat) && Number.isFinite(myLon))) return; // 이미 복원됐거나 실측 위치 확보
    const c = p.coords;
    const lat = c.latitude, lon = c.longitude;
    const acc = Number.isFinite(c.accuracy) ? c.accuracy : 999;
    coldView = coldView || { type: 'hybrid' };
    coldView.coarsePending = false;
    if (Number.isFinite(lat) && Number.isFinite(lon) && acc <= COARSE_MAX_ACC) {
      coldView.coarseCands = coarseCandidates(lat, lon, acc);
      // 박동민 필수 요구: coarse가 저장 위치 300m 밖이면 복원 금지
      if (coldSaved && currentMode === 'main' && distM(lat, lon, coldSaved.lat, coldSaved.lon) <= COARSE_GATE_M) {
        doColdRestore(coldSaved.name, coldSaved.t);
        return;
      }
    }
    coldView.type = 'hybrid';
    refreshDisplay();
  }
  function onColdCoarseErr() {
    if (latch || (Number.isFinite(myLat) && Number.isFinite(myLon))) return;
    coldView = coldView || { type: 'hybrid' };
    coldView.coarsePending = false;
    if (coldSaved && currentMode === 'main') {
      coldView.type = 'confirm'; coldView.name = coldSaved.name; coldView.t = coldSaved.t;
    } else coldView.type = 'hybrid';
    refreshDisplay();
  }
  function doColdRestore(name, savedT) {
    if (coldDismissed || currentMode !== 'main' || !name) return;
    const saved = getSavedComplex();
    const rl = (saved && saved.name === name) ? saved : null;
    const rows = complexItems(name).sort(cmpDong).map(item => {
      const d = rl ? getDist(item.lat, item.lon, rl.lat, rl.lon) : 999999;
      return { item, d, near: d <= searchRadius };
    });
    if (!rows.length) return;
    latch = { items: rows, names: [name], since: Date.now(), kind: 'cold', savedT: savedT || Date.now(), rank: null };
    latchFilter = null; coldView = null; coldAnchor = null; coldGoodStreak = 0;
    lastRender = null;
    refreshDisplay();
  }
  function doColdRestoreConfirm() { if (coldView && coldView.name) doColdRestore(coldView.name, coldView.t); }
  function closeColdRestore(e) { if (e && e.stopPropagation) e.stopPropagation(); coldDismissed = true; releaseLatch(true); }
  function coldDecline() { coldDismissed = true; coldView = { type: 'hybrid', coarsePending: false, coarseCands: [] }; refreshDisplay(); }

  // 칩/검색/전체 목록에서 단지 선택 시 해당 단지 전체 동 표시
  function showComplexRows(name) {
    const rows = complexItems(name).sort(cmpDong).map(item => ({ item, d: 999999, near: false }));
    if (!rows.length) return;
    latch = { items: rows, names: [name], since: Date.now(), kind: 'pick', rank: null };
    latchFilter = null; coldView = null; lastRender = null;
    refreshDisplay();
  }
  function pickRecent(i) { const r = coldRecentList[i]; if (r) showComplexRows(r.name); }
  function pickCoarse(i) { const c = coldCoarseList[i]; if (c) showComplexRows(c.name); }
  function pickSearch(i) { const n = coldSearchList[i]; if (n) showComplexRows(n); }
  function pickComplexByIdx(i) { const n = coldNameList[i]; if (n) showComplexRows(n); }
  function shortAddr(a) { const m = String(a || '').match(/([가-힣0-9]+(동|리|읍|면))/); return m ? m[1] : ''; }
  function coldSearch(q) {
    const res = document.getElementById('cold-search-res');
    if (!res) return;
    const nq = String(q || '').toLowerCase().replace(/\s+/g, '');
    if (!nq) { res.innerHTML = ''; coldSearchList = []; return; }
    coldSearchList = complexNames().filter(n => n.toLowerCase().replace(/\s+/g, '').includes(nq)).slice(0, 8);
    res.innerHTML = coldSearchList.map((n, i) => `<button class="chip" onclick="pickSearch(${i})">${esc(n)}</button>`).join('');
  }
  function renderColdView(container) {
    const v = coldView || { type: 'hybrid' };
    const prevQ = (document.getElementById('cold-search') || {}).value || '';  // 재렌더 시 입력 중인 검색어 유지
    let html = '';
    if (v.type === 'confirm' && v.name) {
      html += `<div class="cold-card"><div style="color:#999; font-size:13px;">🕘 ${fmtAgo(Date.now() - v.t)} 위치</div>` +
        `<div style="font-size:1.2em; font-weight:bold; color:var(--accent); margin:8px 0 12px;">${esc(v.name)}</div>` +
        `<button class="snack-ok" style="padding:10px 18px; border:none; border-radius:8px; font-weight:bold; margin:0 4px; cursor:pointer;" onclick="doColdRestoreConfirm()">전체 동 보기</button>` +
        `<button class="snack-no" style="padding:10px 18px; border:none; border-radius:8px; font-weight:bold; margin:0 4px; cursor:pointer;" onclick="coldDecline()">아니요</button></div>`;
    }
    html += `<div class="cold-status">${v.coarsePending ? '📡 위치 확인 중...' : '📡 GPS 신호 없음 — 아래에서 단지를 선택하세요'}</div>`;
    coldCoarseList = (v.coarseCands || []).slice();
    if (coldCoarseList.length) {
      html += `<div class="cold-sec">내 주변 후보 단지</div><div class="chip-row">` +
        coldCoarseList.map((c, i) => `<button class="chip" onclick="pickCoarse(${i})">${esc(c.name)} <small>약 ${Math.round(c.d)}m</small></button>`).join('') + `</div>`;
    }
    coldRecentList = getRecents().slice(0, RECENT_CHIP_N);
    if (coldRecentList.length) {
      html += `<div class="cold-sec">최근 방문 단지</div><div class="chip-row">` +
        coldRecentList.map((r, i) => { const sa = shortAddr(r.addr); return `<button class="chip" onclick="pickRecent(${i})">${esc(r.name)}${sa ? ` <small>(${esc(sa)})</small>` : ''}</button>`; }).join('') + `</div>`;
    }
    html += `<div class="cold-sec">단지 검색</div><input type="text" id="cold-search" placeholder="단지명 입력" autocomplete="off" value="${esc(prevQ)}" oninput="coldSearch(this.value)"><div id="cold-search-res" class="chip-row" style="margin-top:6px;"></div>`;
    coldNameList = complexNames().sort((a, b) => a.localeCompare(b, 'ko'));
    html += `<div class="cold-sec">전체 단지 (${coldNameList.length})</div><div class="chip-row">` +
      coldNameList.map((n, i) => `<button class="chip" onclick="pickComplexByIdx(${i})">${esc(n)}</button>`).join('') + `</div>`;
    container.innerHTML = html;
    if (prevQ) coldSearch(prevQ);
    lastRender = { cold: true }; lastShown = [];
    updateStatus();
  }

  // 래치 표시: 콜드/선택/dual(상위 2개 단지)/일반 배지 + 단지 필터
  function renderLatchView(container) {
    if (lastRender && lastRender.latch === latch && lastRender.latchFilter === latchFilter) return;
    const now = Date.now();
    const rank = latch.rank;
    const dual = !!(rank && rank.mode === 'dual' && rank.ordered && rank.ordered.length >= 2);
    let badge;
    if (latch.kind === 'cold') {
      badge = `<div class="latch-badge"><span id="cold-badge-txt">🕘 ${fmtAgo(now - (latch.savedT || latch.since))} 위치 기준 — 현위치 아님</span> <span class="cold-x" onclick="closeColdRestore(event)">✕</span></div>`;
    } else if (latch.kind === 'pick') {
      badge = `<div class="latch-badge" onclick="releaseLatch(true)">📍 ${esc(latch.names[0] || '')} 전체 동 (터치 시 해제)</div>`;
    } else if (dual) {
      badge = `<div class="latch-badge" onclick="releaseLatch(true)">📡 신호 미약 — 인접 2개 단지 동시 표시 (터치 시 해제)</div>`;
    } else if (latch.names && latch.names.length > 0) {
      const t = latch.names.length > 1 ? '인근 단지 전체 동' : latch.names[0] + ' 전체 동';
      const prefix = latch.kind === 'jump' ? '📡 위치 튐 감지 — ' : '📡 신호 끊김 — ';
      badge = `<div class="latch-badge" onclick="releaseLatch(true)">${prefix}${esc(t)}</div>`;
    } else if (latch.kind === 'jump') {
      badge = `<div class="latch-badge" onclick="releaseLatch(true)">📡 위치 튐 감지 — 확인 중 (터치 시 해제)</div>`;
    } else {
      badge = `<div class="latch-badge" onclick="releaseLatch(true)">[지하 진입 인식] 고정 중 (터치 시 해제)</div>`;
    }
    let chips = '';
    if (dual) {
      chips = `<div class="fchip-row"><button class="fchip${latchFilter == null ? ' active' : ''}" onclick="setLatchFilter(-1)">전체</button>` +
        rank.ordered.map((n, i) => `<button class="fchip${latchFilter === n ? ' active' : ''}" onclick="setLatchFilter(${i})">${esc(n)}</button>`).join('') + `</div>`;
    }
    let items = latch.items;
    if (latchFilter != null) items = items.filter(r => String(r.item.name) === latchFilter);
    let html = badge + chips, curSec = null;
    items.forEach(r => {
      const n = String(r.item.name);
      if (dual && latchFilter == null && n !== curSec) {
        curSec = n;
        html += `<div class="rank-sec">${rank.ordered.indexOf(n) === 0 ? '🥇 1순위' : '🥈 2순위'} · ${esc(n)}</div>`;
      }
      html += cardHtml(r, false);
    });
    container.innerHTML = html;
    lastRender = { latch, latchFilter };
  }
  function setLatchFilter(i) {
    latchFilter = (i < 0 || !latch || !latch.rank) ? null : (latch.rank.ordered[i] || null);
    lastRender = null;
    refreshDisplay();
  }

  // 운행 모드 렌더링: 거리 1회 계산 → 이탈 지연 필터 → 정렬 → (변화 없으면) 렌더 생략
  function renderMain(container) {
    const hasFix = Number.isFinite(myLat) && Number.isFinite(myLon);
    if (!isGpsReady && !hasFix) {
      container.innerHTML = `<div id="loading-msg" style="color:#555; text-align:center; margin-top:80px;">📍 현재 위치를 확인 중입니다...</div>`;
      lastRender = null;
      return;
    }
    if (!hasFix && !coldChecked) coldBootCheck();
    if (latch) { renderLatchView(container); return; }
    if (!hasFix && coldView) { renderColdView(container); return; }
    const ref = hasFix ? { lat: myLat, lon: myLon } : getSavedPos();
    usingSavedPos = hasFix ? null : ref;
    if (!ref) { coldView = coldView || { type: 'hybrid', coarsePending: false, coarseCands: [] }; renderColdView(container); return; }

    const now = Date.now();
    const exitR = searchRadius + Math.max(HYST_MIN_M, hasFix && Number.isFinite(myAcc) ? myAcc : 0);
    const scored = allData.map(item => ({ item, k: keyOf(item), d: getDist(item.lat, item.lon, ref.lat, ref.lon) }));
    scored.forEach(s => { if (s.d <= searchRadius) lastInAt.set(s.k, now); });
    lastInAt.forEach((t, k) => { if (now - t > HYST_MS) lastInAt.delete(k); });
    const rows = scored
      .filter(s => s.d <= searchRadius || (shownKeys.has(s.k) && s.d <= exitR && lastInAt.has(s.k)))
      .sort((a, b) => a.d - b.d);
    rows.forEach(r => { r.near = r.d <= searchRadius; });
    const approach = updatePrefetch(scored, rows, now);

    if (hasFix && !suppressNearFx && rows.some(r => r.near && !shownKeys.has(r.k))) onNearEntry();
    shownKeys = new Set(rows.map(r => r.k));
    lastShown = rows;

    const approachKey = approach ? approach.name + '@' + Math.round(approach.d / 10) * 10 : '';
    const sig = [searchRadius, dataVer, approachKey].concat(rows.map(r => r.k + (r.near ? '*' : ''))).join('\u0002');
    if (lastRender && lastRender.sig === sig && distM(lastRender.lat, lastRender.lon, ref.lat, ref.lon) < RENDER_MIN_MOVE) return;
    lastRender = { sig, lat: ref.lat, lon: ref.lon };

    if (rows.length === 0) {
      const hint = approach ? `<div class="approach-hint">접근 중 · ${esc(approach.name)} 약 ${Math.round(approach.d / 10) * 10}m</div>` : '';
      container.innerHTML = `<div style="color:#555; text-align:center; margin-top:50px;">주변 ${searchRadius}m 이내 없음${hint}</div>`;
    } else {
      container.innerHTML = rows.map(r => cardHtml(r, false)).join('');
    }
  }

  // 2단계 지오펜스: 150m 안에 들어온 단지는 동 목록을 미리 정렬·HTML 준비해 둔다
  function updatePrefetch(scored, rows, now) {
    const near = new Map();
    scored.forEach(s => {
      if (s.d > PREFETCH_R) return;
      const n = String(s.item.name);
      if (!near.has(n) || s.d < near.get(n)) near.set(n, s.d);
    });
    near.forEach((d, name) => {
      const pc = prefetch.get(name);
      if (pc) { pc.t = now; return; }
      const list = allData.filter(i => String(i.name) === name)
        .sort((a, b) => String(a.dong).localeCompare(String(b.dong), 'ko', { numeric: true }));
      prefetch.set(name, { t: now, list, html: new Map(list.map(i => [keyOf(i), buildBody(i, false)])) });
    });
    prefetch.forEach((pc, name) => { if (now - pc.t > 60000) prefetch.delete(name); });

    const shownNames = new Set(rows.map(r => String(r.item.name)));
    let best = null;
    near.forEach((d, name) => { if (!shownNames.has(name) && (!best || d < best.d)) best = { name, d }; });
    return best;
  }

  function buildBody(i, manage) {
    const dong = String(i.dong);
    return `<div class="apt-info"><div class="apt-name">${esc(i.name)}</div><div class="apt-dong">${esc(dong)}</div></div><div class="pw-info"><div class="pw-text ${dong.includes("공통") ? 'common' : ''}">${esc(i.pw)}</div>${manage ? `<button class="delete-btn" onclick="deleteData('${esc(i.id)}', event)">삭제</button>` : ''}</div>`;
  }

  function cardHtml(r, manage) {
    const i = r.item;
    const pc = !manage && prefetch.get(String(i.name));
    const body = (pc && pc.html.get(keyOf(i))) || buildBody(i, manage);
    return `<div class="list-item ${r.near ? 'near' : ''}" onclick="showEditModal(${esc(JSON.stringify(i))})">${r.near ? `<span class="dist-tag">${Math.round(r.d)}m</span>` : ''}${body}</div>`;
  }

  // 위도 보정 평면 근사 거리(m)
  function distM(lat1, lon1, lat2, lon2) {
    const dx = (lon2 - lon1) * 111000 * Math.cos(lat1 * Math.PI / 180);
    const dy = (lat2 - lat1) * 111000;
    return Math.hypot(dx, dy);
  }

  function getDist(latStr, lonStr, refLat = myLat, refLon = myLon) {
    if (!latStr || !Number.isFinite(refLat) || !Number.isFinite(refLon)) return 999999;
    const lats = String(latStr).split('|'), lons = String(lonStr).split('|'); let minD = 999999;
    lats.forEach((lt, idx) => {
      const a = parseFloat(lt), o = parseFloat(lons[idx]);
      if (!Number.isFinite(a) || !Number.isFinite(o)) return;
      const d = distM(refLat, refLon, a, o);
      if (d < minD) minD = d;
    });
    return minD;
  }
  
  function deleteData(id, event) { 
    event.stopPropagation(); 
    if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(id))) { showMsg('잘못된 요청입니다.'); return; }
    if (navigator.vibrate) { navigator.vibrate([200, 100, 200]); }
    
    showMsg("데이터가 완전히 삭제됩니다.\n보안 비밀번호(4자리)를 입력해 주십시오.", async (pw) => {
      if(!pw) { showMsg("비밀번호 검증이 취소되었습니다."); return; }
      try {
        const res = await fetch(SUPABASE_URL + '/functions/v1/apt-admin', { method: 'POST', headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw, id }) });
        const j = await res.json();
        showMsg(j.msg); if (j.success) loadData();
      } catch (e) { showMsg('삭제 요청 실패: 네트워크 오류'); }
    }, true, true);
  }
  
  // 좌표 입력 검증: 빈 쌍 제거, 위도 -90~90 / 경도 -180~180, 위도·경도 개수 일치
  function collectCoords() {
    const lats = [], lons = [];
    const latEls = document.querySelectorAll('.lat-val'), lonEls = document.querySelectorAll('.lon-val');
    if (latEls.length !== lonEls.length) return { err: "위도와 경도의 개수가 일치하지 않습니다." };
    for (let idx = 0; idx < latEls.length; idx++) {
      const a = latEls[idx].value.trim(), o = lonEls[idx].value.trim();
      if (!a && !o) continue;
      if (!a || !o) return { err: "위도와 경도는 쌍으로 입력해야 합니다." };
      const la = Number(a), lo = Number(o);
      if (!Number.isFinite(la) || la < -90 || la > 90) return { err: "위도 값이 올바르지 않습니다 (-90 ~ 90):\n" + a };
      if (!Number.isFinite(lo) || lo < -180 || lo > 180) return { err: "경도 값이 올바르지 않습니다 (-180 ~ 180):\n" + o };
      lats.push(a); lons.push(o);
    }
    return { lat: lats.join('|'), lon: lons.join('|') };
  }

  // 주소 → 좌표 (기존 GAS 서버측 Maps.newGeocoder 대체)
  async function geocodeAddr(addr) {
    const q = addr.includes('포항') ? addr : '경상북도 포항시 ' + addr;
    try {
      const res = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=' + encodeURIComponent(q));
      const j = await res.json();
      return (j && j[0]) ? { lat: j[0].lat, lon: j[0].lon } : null;
    } catch (e) { return null; }
  }

  async function saveData() {
    const c = collectCoords();
    if (c.err) { showMsg(c.err); return; }
    const d = { id: document.getElementById('edit-row').value, name: document.getElementById('in-name').value, dong: document.getElementById('in-dong').value, pw: document.getElementById('in-pw').value, addr: document.getElementById('in-addr').value, lat: c.lat, lon: c.lon, note: document.getElementById('in-note').value };
    if ((!d.lat || !d.lon) && d.addr) {
      const g = await geocodeAddr(d.addr);
      if (g) { d.lat = g.lat; d.lon = g.lon; }
    }
    const payload = { apt_name: d.name, dong_line: d.dong, password: d.pw, address: d.addr, lat: d.lat, lng: d.lon, notes: d.note };
    const editId = document.getElementById('edit-row').value;
    const q = editId ? sb.from('apt_passwords').update(payload).eq('id', editId) : sb.from('apt_passwords').insert([payload]);
    const { error } = await q;
    if (error) { showMsg('저장 실패: ' + error.message); return; }
    hideInputModal(); loadData(); showMsg('성공적으로 저장되었습니다!');
  }
  
  function addGpsRow(lat = "", lon = "") {
    const container = document.getElementById('gps-container');
    const isFirst = container.children.length === 0;
    const div = document.createElement('div'); div.className = 'gps-row';
    let buttons = isFirst ? `<button type="button" class="row-btn" style="color:var(--error);" onclick="removeLastGpsRow()">-</button><button type="button" class="row-btn" style="color:var(--accent);" onclick="addGpsRow()">+</button>` : `<div style="width:45px;"></div><div style="width:45px;"></div>`;
    div.innerHTML = `<input type="text" class="lat-val" placeholder="위도" autocomplete="off" value="${esc(lat)}"><input type="text" class="lon-val" placeholder="경도" autocomplete="off" value="${esc(lon)}">${buttons}`;
    container.appendChild(div);
  }
  function removeLastGpsRow() { const rows = document.querySelectorAll('.gps-row'); if (rows.length > 1) { rows[rows.length - 1].remove(); } else { showMsg("최소 1개의 좌표는 필요합니다."); } }
  function setAccMsg(text, color) { const el = document.getElementById('gps-acc-msg'); el.textContent = text; el.style.color = color || '#999'; }
  function getGPS() {
    if (!navigator.geolocation) { setAccMsg("이 기기에서는 위치를 사용할 수 없습니다.", "var(--error)"); return; }
    setAccMsg("📡 위치 측정 중... (최대 15초)");
    navigator.geolocation.getCurrentPosition(p => {
      const rows = document.querySelectorAll('.gps-row'); const lastRow = rows[rows.length - 1]; const latIn = lastRow.querySelector('.lat-val'); const lonIn = lastRow.querySelector('.lon-val');
      if (latIn.value || lonIn.value) { addGpsRow(p.coords.latitude, p.coords.longitude); } else { latIn.value = p.coords.latitude; lonIn.value = p.coords.longitude; }
      const acc = Math.round(p.coords.accuracy);
      if (acc > 20) setAccMsg(`측정 정확도 ±${acc}m\n⚠️ 정확도 낮음, 출입구 앞에서 재측정 권장`, "var(--error)");
      else setAccMsg(`측정 정확도 ±${acc}m`, "var(--accent)");
    }, err => {
      const msg = { 1: "위치 권한이 거부되었습니다.\n설정에서 위치 권한을 허용해 주세요.", 2: "현재 위치를 확인할 수 없습니다.\n실외·출입구 앞에서 다시 시도해 주세요.", 3: "위치 측정 시간이 초과되었습니다(15초).\n다시 시도해 주세요." }[err && err.code] || "위치를 가져오지 못했습니다.";
      setAccMsg(msg, "var(--error)");
      showMsg(msg);
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  }
  function showAddModal() { ['edit-row','in-name','in-dong','in-pw','in-addr','in-note'].forEach(id => document.getElementById(id).value = ""); document.getElementById('gps-container').innerHTML = ""; setAccMsg(""); addGpsRow(); document.getElementById('input-modal').style.display = 'block'; }
  function showEditModal(i) {
    setAccMsg("");
    document.getElementById('edit-row').value = i.id || ''; document.getElementById('in-name').value = i.name; document.getElementById('in-dong').value = i.dong; document.getElementById('in-pw').value = i.pw;
    document.getElementById('in-addr').value = i.addr; document.getElementById('in-note').value = i.note;
    const container = document.getElementById('gps-container'); container.innerHTML = "";
    const lats = String(i.lat).split('|'), lons = String(i.lon).split('|');
    lats.forEach((lt, idx) => addGpsRow(lt, lons[idx] || ""));
    if (lats.length === 0) addGpsRow();
    document.getElementById('input-modal').style.display = 'block';
  }
  function hideInputModal() { document.getElementById('input-modal').style.display = 'none'; }
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function() { navigator.serviceWorker.register('sw.js'); }); }
</script>
