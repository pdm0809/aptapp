  function startWatch() {

  function onPos(p) {

      // 오염된 Wi-Fi 위치(3km 점프)가 어림 목록에 침투하지 못하도록 게이트를 먼저 적용
      const staleD = lastGood && now - lastGood.t > STALE_MS;
      const ugOrLatchD = !!(latch || staleD);
      const gateD = isPlausibleFromAnchor(lat, lon, acc, now, ugOrLatchD);
      if (!gateD.ok) {

      }
      jumpRejected = null;
      // degradedPos는 표시 전용. myLat/myLon/lastGood/앵커/latch/자동선택에 절대 사용 금지
      degradedPos = { lat, lon, acc, t: now };
      // P0-2: coldView 활성 중이면 wpsCands도 갱신 (뒤늦게 오는 Wi-Fi 위치를 후보 칩으로)

    // (Wi-Fi 오염 픽스는 카운트하지 않음 — 고정 오염 AP에 물려도 점프 확정 방지)
    // 보류 중에는 점프 직전 마지막 신뢰 위치 기준으로 해당 단지 전체 동을 표시

    if (dCur > COLD_SILENT_M) {

      if (best && best !== snackMutedFor) { snackName = best; showColdSnack(best); }

  // 양호 위치에서 표시 중인 단지 저장 (최근 방문 칩용)
  function saveGoodComplex(lat, lon, acc, t) {
    const cnt = new Map(), addrOf = new Map();
    (lastShown || []).forEach(r => {
      if (!r || !r.item || !r.near) return;
      const n = String(r.item.name || '');
      if (!n) return;
      cnt.set(n, (cnt.get(n) || 0) + 1);
      if (!addrOf.get(n) && r.item.addr) addrOf.set(n, r.item.addr);
    });
    let name = null, best = 0;
    cnt.forEach((c, n) => { if (c > best) { best = c; name = n; } });
    if (!name) return;
    try {
      saveRecent(name, addrOf.get(name) || '');
    } catch (e) {}
  }
  function getRecents() {

    if (!name) return;

  // 1초 감시: 끊김 배너, 지하 고정 진입/만료, 이탈 지연 항목 정리
  function watchdog() {
    const now = Date.now();
    // H3 수정 (2026-10-17): 수동 선택(pick) 래치는 시간 만료로 자동 해제하지 않음 — 사용자가 지하에서 직접 고른 화면 보호
    // 단, GPS 신호가 복구되어 지상 탈출이 확인되면 acceptPosCold에서 해제됨
    if (latch && now - latch.since > LATCH_MAX_MS && latch.kind !== 'pick') releaseLatch(true);

  // 동 정렬: 숫자 우선 자연 정렬 ("101동" < "119동" < "공통")
  function cmpDong(a, b) {
    return String(a.dong || '').localeCompare(String(b.dong || ''), 'ko', { numeric: true });
  }

  // ===== 래치 정확도: 단지 후보 스코어링 (순수 함수) =====
  function itemCoords(item) {
    if (!item || !item.lat) return [];
    const lats = String(item.lat).split('|'), lons = String(item.lon).split('|'), out = [];
    lats.forEach((lt, idx) => {
      const a = parseFloat(lt), o = parseFloat(lons[idx]);
      if (Number.isFinite(a) && Number.isFinite(o)) out.push({ lat: a, lon: o });
    });
    return out;
  }
  function complexNames() {
    const seen = new Set();
    (allData || []).forEach(i => { const n = String(i.name || ''); if (n) seen.add(n); });
    return [...seen];
  }
  function complexItems(name) {
    return (allData || []).filter(i => String(i.name) === name);
  }
  function complexValidRatio(name) {
    const items = complexItems(name);
    if (!items.length) return 0;
    return items.filter(i => itemCoords(i).length > 0).length / items.length;
  }
  function distToItem(item, lat, lon) {
    return getDist(item.lat, item.lon, lat, lon);
  }
  function complexMinDist(name, lat, lon) {
    let minD = 999999;
    complexItems(name).forEach(i => { const d = distToItem(i, lat, lon); if (d < minD) minD = d; });
    return minD;
  }
  function dKAvg(name, lat, lon) {
    const ds = complexItems(name).filter(i => itemCoords(i).length > 0)
      .map(i => distToItem(i, lat, lon)).sort((a, b) => a - b).slice(0, K_NEAREST);
    if (!ds.length) return { avg: 999999, n: 0 };
    const avg = ds.reduce((s, d) => s + d, 0) / ds.length;
    return { avg: ds.length < K_NEAREST ? avg + K_PENALTY_M : avg, n: ds.length };
  }
  function complexCentroid(name) {
    let sLat = 0, sLon = 0, n = 0;
    complexItems(name).forEach(i => itemCoords(i).forEach(c => { sLat += c.lat; sLon += c.lon; n++; }));
    return n ? { lat: sLat / n, lon: sLon / n } : null;
  }
  // 기준점에서 반경 SPAN_R_M 내 단지 건물들을 바라보는 방위각 전개폭(도)
  function bearingSpan(name, lat, lon) {
    const cosLat = Math.cos(lat * Math.PI / 180), bs = [];
    complexItems(name).forEach(i => itemCoords(i).forEach(c => {
      if (distM(lat, lon, c.lat, c.lon) > SPAN_R_M) return;
      let b = Math.atan2((c.lon - lon) * cosLat, c.lat - lat) * 180 / Math.PI;
      if (b < 0) b += 360;
      bs.push(b);
    }));
    if (bs.length < 2) return 0;
    bs.sort((a, b) => a - b);
    let maxGap = bs[0] + 360 - bs[bs.length - 1];
    for (let k = 1; k < bs.length; k++) maxGap = Math.max(maxGap, bs[k] - bs[k - 1]);
    return 360 - maxGap;
  }
  function pushFixBuf(lat, lon, acc, t) {
    if (!(acc <= FIXBUF_GOOD_ACC)) return;
    fixBuf.push({ lat, lon, acc, t });
    fixBuf = fixBuf.filter(f => t - f.t <= FIXBUF_WIN_MS).slice(-FIXBUF_N);
  }
  // 각 fix가 최근접 단지에 (1/acc)*exp(-age/VOTE_DECAY_MS) 가중 투표 (age 기준 = 최신 fix 시각)
  function voteComplexes() {
    if (!fixBuf.length) return [];
    const tRef = fixBuf[fixBuf.length - 1].t, names = complexNames(), votes = new Map();
    let total = 0;
    fixBuf.forEach(f => {
      let best = null, bestD = 999999;
      names.forEach(n => { const d = complexMinDist(n, f.lat, f.lon); if (d < bestD) { bestD = d; best = n; } });
      if (!best) return;
      const w = (1 / Math.max(f.acc, 1)) * Math.exp(-(tRef - f.t) / VOTE_DECAY_MS);
      votes.set(best, (votes.get(best) || 0) + w);
      total += w;
    });
    const out = [];
    votes.forEach((v, name) => out.push({ name, votes: v, share: total > 0 ? v / total : 0 }));
    return out.sort((a, b) => b.share - a.share);
  }
  // 이동 방향(처음→마지막 fix)과 최신 fix→단지중심 방향의 cos. 판정 불가 시 null
  function headingCos(name) {
    if (fixBuf.length < 2) return null;
    const f0 = fixBuf[0], f1 = fixBuf[fixBuf.length - 1];
    // NaN 가드: position.coords는 항상 finite라 실유입 경로는 거의 없음 — 방어용
    if (![f0.lat, f0.lon, f1.lat, f1.lon].every(Number.isFinite)) return 0;
    const dt = f1.t - f0.t;
    if (dt < HEAD_MIN_MS) return null;
    const cosLat = Math.cos(f1.lat * Math.PI / 180);
    const mx = (f1.lon - f0.lon) * 111000 * cosLat, my = (f1.lat - f0.lat) * 111000;
    const mv = Math.hypot(mx, my);
    if (mv / (dt / 1000) * 3.6 < SPEED_SLOW_KMH) return null;
    const c = complexCentroid(name);
    if (!c) return null;
    if (!Number.isFinite(c.lat) || !Number.isFinite(c.lon)) return 0;
    const cx = (c.lon - f1.lon) * 111000 * cosLat, cy = (c.lat - f1.lat) * 111000;
    const cv = Math.hypot(cx, cy);
    if (cv === 0) return null;
    return (mx * cx + my * cy) / (mv * cv);
  }
  function dwellMs() {
    return fixBuf.length < 2 ? 0 : fixBuf[fixBuf.length - 1].t - fixBuf[0].t;
  }
  function activeComplex(items) {
    const cnt = new Map();
    (items || lastShown || []).forEach(r => {
      const n = r && r.item ? String(r.item.name || '') : '';
      if (n) cnt.set(n, (cnt.get(n) || 0) + 1);
    });
    let best = null, bestC = 0;
    cnt.forEach((c, n) => { if (c > bestC) { bestC = c; best = n; } });
    return best;
  }
  function scoreComplexes(names, lat, lon) {
    const voteMap = new Map(voteComplexes().map(v => [v.name, v.share]));
    const dwell = dwellMs();
    const base = names.map(name => ({ name, dkAvg: dKAvg(name, lat, lon).avg }));
    const byD = [...base].sort((a, b) => a.dkAvg - b.dkAvg);
    const leadGap = byD.length > 1 ? byD[1].dkAvg - byD[0].dkAvg : 999;
    return base.map(b => {
      const deltaD = b.name === byD[0].name ? leadGap : 0;  // 1위가 아니면 거리 마진 0점
      const share = voteMap.get(b.name) || 0;
      const span = bearingSpan(b.name, lat, lon);
      const head = headingCos(b.name);
      const pDk = deltaD >= DK_MARGIN_FULL ? DK_PTS_FULL : deltaD >= DK_MARGIN_PART ? DK_PTS_PART : 0;
      // 득표 60~69% 구간은 0점이지만 폴백이 아님 — 다른 신호 만점으로 70점 도달 가능 (의도된 동작)
      const pVote = share >= VOTE_FULL ? VOTE_PTS_FULL : share >= VOTE_PART ? VOTE_PTS_PART : 0;
      const pSpan = span >= SPAN_FULL ? SPAN_PTS_FULL : span >= SPAN_PART ? SPAN_PTS_PART : 0;
      const pHead = head == null ? 0 : head >= HEAD_FULL ? HEAD_PTS_FULL : head >= HEAD_PART ? HEAD_PTS_PART : 0;  // 저속 시 0점, 재배분 없음
      const pDwell = dwell >= DWELL_FULL_MS ? DWELL_PTS_FULL : dwell >= DWELL_PART_MS ? DWELL_PTS_PART : 0;
      return {
        name: b.name, score: pDk + pVote + pSpan + pHead + pDwell,
        parts: { dk: pDk, vote: pVote, span: pSpan, head: pHead, dwell: pDwell },
        dkAvg: b.dkAvg, voteShare: share, span, validRatio: complexValidRatio(b.name)
      };
    });
  }
  // 폴백(상위 2개 동시 표시) 사유 | null. scored: 점수 내림차순(P5 적용 후), 최소 2개
  function checkFallbacks(scored, deltaD, lat, lon) {
    const s0 = scored[0], s1 = scored[1];
    if ((s0.voteShare || 0) < VOTE_FALLBACK || (s0.voteShare - s1.voteShare) < VOTE_GAP_FALLBACK) return 'vote';
    if (deltaD < DK_MARGIN_FALLBACK) return 'margin';
    const good = fixBuf.filter(f => f.acc <= FIXBUF_GOOD_ACC);
    if (good.length >= 1 && good.every(f =>
        complexMinDist(s0.name, f.lat, f.lon) <= f.acc && complexMinDist(s1.name, f.lat, f.lon) <= f.acc)) return 'accuracy';
    if (fixBuf.filter(f => f.acc <= GOOD_FIX_ACC).length < GOOD_FIX_MIN) return 'fewfix';
    if (s0.validRatio < VALID_COORD_RATIO || s1.validRatio < VALID_COORD_RATIO) return 'badratio';
    if (s0.span < SPAN_FALLBACK && s1.span < SPAN_FALLBACK) return 'span';
    return null;
  }
  function rankComplexes(names, lat, lon) {
    const uniq = [...new Set(names.filter(Boolean))];
    if (uniq.length <= 1) return { mode: 'single', ordered: uniq, scores: [], reason: null };
    let scored = scoreComplexes(uniq, lat, lon);
    const active = activeComplex(lastShown);
    const activeIn = !!(active && uniq.includes(active));
    scored.forEach(s => { if (activeIn && s.name === active) s.score = Math.min(100, s.score + P5_BONUS); }); // P5는 가점만. renderMain 진입 로직 변경 금지
    scored.sort((a, b) => b.score - a.score || a.dkAvg - b.dkAvg);
    const byD = [...scored].sort((a, b) => a.dkAvg - b.dkAvg);
    const deltaD = byD.length > 1 ? byD[1].dkAvg - byD[0].dkAvg : 999;
    const fb = checkFallbacks(scored, deltaD, lat, lon);
    // margin 폴백(거리로 구분 불가): 원칙 "확실하지 않으면 보여주던 단지를 1순위로" — 활성 단지가 있으면 활성 1순위, 도전자 2순위.
    // (없으면 deltaD>=10m의 challenger-hold보다 거리상 덜 확실한 쪽에서 도전자가 1순위가 되는 역전 발생)
    // 활성 단지가 없는 최초 래치는 아래 점수 순 표시
    if (fb === 'margin' && activeIn) {
      const other = scored.find(s => s.name !== active);
      return { mode: 'dual', ordered: [active, other.name], scores: scored, reason: fb };
    }
    if (fb) return { mode: 'dual', ordered: [scored[0].name, scored[1].name], scores: scored, reason: fb };
    const top = scored[0];
    if (top.score < SCORE_CUTOFF) return { mode: 'dual', ordered: [top.name, scored[1].name], scores: scored, reason: 'cutoff' };
    if (activeIn && top.name !== active) {
      if (top.score >= CHALLENGER_MIN) return { mode: 'single', ordered: [top.name], scores: scored, reason: 'challenger-win' };
      return { mode: 'dual', ordered: [active, top.name], scores: scored, reason: 'challenger-hold' }; // 폴백 #7
    }
    return { mode: 'single', ordered: [top.name], scores: scored, reason: null };
  }
  // WPS 위치 기준 단지 후보: dKAvg ≤ acc + 필터 여유, 가까운 순
  function wpsCandidates(lat, lon, acc) {
    return complexNames()
      .map(name => ({ name, d: dKAvg(name, lat, lon).avg }))
      .filter(c => c.d <= acc + WPS_CANDIDATE_FILTER_M)
      .sort((a, b) => a.d - b.d);
  }
  // WPS 후보 순위 → 동작 결정 (순수 함수). 후보 1개면 격차 조건은 vacuously true
  function decideWpsAction(ranked, acc) {
    if (acc > WPS_MAX_ACC_M) return { action: 'hybrid' };
    if (!ranked.length) return { action: 'hybrid' };
    if (acc <= WIFI_AUTO_MAX_ACC_M && ranked[0].d <= WPS_AUTO_MAX_D_M &&
        (ranked.length < 2 || ranked[1].d - ranked[0].d >= WPS_AUTO_MIN_GAP_M)) return { action: 'auto', name: ranked[0].name };
    return { action: 'pick' };
  }

  // latch 표시 목록 확장 (순수 함수)
  // allData: 전체 행 [{id, name, dong, ...}], nearbyItems: latch 직전 화면 행 [{item, d, near}] (거리순 정렬됨),
  // refPos: {lat, lon} | null — nearbyItems가 비었을 때 300m 폴백용
  // 반환: { rows: [{item, d, near}], names: [apt_name...], rank: rankComplexes 결과 | null }
  function expandComplex(allData, nearbyItems, refPos) {
    const seen = new Set();
    let names = [];
    const near = (nearbyItems || []).filter(r => r && r.item && r.near);
    near.forEach(r => {
      const n = String(r.item.name || '');
      if (n && !seen.has(n)) { seen.add(n); names.push(n); }
    });
    // 폴백: 표시 목록이 비었으면 마지막 위치 기준 300m 이내 건물에서 단지명 수집
    if (names.length === 0 && refPos && Number.isFinite(refPos.lat) && Number.isFinite(refPos.lon) && Array.isArray(allData)) {
      allData.forEach(item => {
        if (getDist(item.lat, item.lon, refPos.lat, refPos.lon) <= 300) {
          const n = String(item.name || '');
          if (n && !seen.has(n)) { seen.add(n); names.push(n); }
        }
      });
    }
    if (names.length === 0) return { rows: [], names: [], rank: null };
    // 후보 2개 이상: 스코어링으로 1개 확정 또는 상위 2개(dual)로 캡
    let rank = null;
    const posOk = refPos && Number.isFinite(refPos.lat) && Number.isFinite(refPos.lon);
    if (names.length >= 2 && posOk) {
      rank = rankComplexes(names, refPos.lat, refPos.lon);
      names = rank.ordered; // dual이어도 최대 2개로 캡
    }
    // 래치 표시: 단지별 그룹 + 동 번호 오름차순 (101동부터). 가까운 동 거리순 우선은 적용하지 않음.
    const nearById = new Map(near.map(r => [r.item.id, r]));
    const rows = [];
    names.forEach(n => {
      allData
        .filter(item => String(item.name || '') === n)
        .sort(cmpDong)
        .forEach(item => {
          const prev = nearById.get(item.id);
          rows.push({ item, d: prev ? prev.d : (posOk ? getDist(item.lat, item.lon, refPos.lat, refPos.lon) : 999999), near: !!prev });
        });
    });
    return { rows, names, rank };
  }

  // 점프 보류 중 표시: 점프 직전 마지막 신뢰 위치 기준으로 해당 단지 전체 동 표시
  function holdJumpComplex() {
    if (latch && (latch.kind === 'wps' || latch.kind === 'pick')) return;  // CP3: WPS/수동 선택 화면 보호
    if (currentMode !== 'main' || !lastGood) return;
    const exp = expandComplex(allData, lastShown, { lat: lastGood.lat, lon: lastGood.lon });
    latch = exp.names.length > 0
      ? { items: exp.rows, names: exp.names, since: Date.now(), kind: 'jump', rank: exp.rank || null }
      : { items: lastShown.slice(), names: [], since: Date.now(), kind: 'jump', rank: null };
    latchFilter = null;
    refreshDisplay();
  }

  // 단지 반경 안에 머무는 중일 때만 현재 표시된 카드 고정 (확장: 해당 단지 전체 동)
  function maybeLatch() {
    if (latch || latchSuppressed || currentMode !== 'main' || !lastGood) return;
    if (!lastShown.some(r => r.near)) return;
    const exp = expandComplex(allData, lastShown, { lat: myLat, lon: myLon });
    latch = exp.names.length > 0
      ? { items: exp.rows, names: exp.names, since: Date.now(), kind: 'signal', rank: exp.rank || null }
      : { items: lastShown.slice(), names: [], since: Date.now(), kind: 'signal', rank: null };
    latchFilter = null;
    refreshDisplay();
  }

  function releaseLatch(manual) {
    const wasCold = latch && (latch.kind === 'wps' || latch.kind === 'pick');
    latch = null;
    if (manual) latchSuppressed = true;   // 새 위치가 들어올 때까지 재고정 안 함
    // WPS/수동 선택 화면 만료 시 fix가 없으면 이전 위치 목록이 뜨지 않도록 하이브리드 뷰로 복귀 (수동 해제와 동일 처리)
    if (wasCold && !(Number.isFinite(myLat) && Number.isFinite(myLon))) coldView = { type: 'hybrid', wpsPending: false, wpsCands: [] };
    lastRender = null;
    refreshDisplay();
    updateStatus();
  }

  function getSavedPos() {
    try {
      const s = JSON.parse(localStorage.getItem('last_good_pos') || 'null');
      if (s && Number.isFinite(s.lat) && Number.isFinite(s.lon)) return s;
    } catch (e) {}
    return null;
  }

  function fmtAgo(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + '초 전';
    if (s < 3600) return Math.round(s / 60) + '분 전';
    return Math.round(s / 3600) + '시간 전';
  }

  function updateStatus() {
    const el = document.getElementById('gps-status');
    if (!el) return;
    const msgs = [], now = Date.now();
    if (currentMode === 'main') {
      const stale = lastGood && now - lastGood.t > STALE_MS;
      if (gpsErr) msgs.push(GPS_ERR_MSG[gpsErr] || '위치 오류');
      if (stale) msgs.push(`GPS 끊김 · ${Math.round((now - lastGood.t) / 1000)}초 전 위치 기준`);
      else if (usingSavedPos) msgs.push(`이전 위치 기준 (${fmtAgo(now - usingSavedPos.t)})`);
      if (!gpsErr && !stale && lastAcc != null && lastAcc > ACC_WEAK) msgs.push(`신호 약함 (±${Math.round(lastAcc)}m)` + (lastAcc > ACC_REJECT ? ' · 위치 갱신 보류' : ''));
      if (pendingJump) msgs.push('위치 급변 감지 · 확인 중');
      if (jumpRejected) msgs.push(`⚠️ 위치 튐 의심 차단 (${(jumpRejected.dist/1000).toFixed(1)}km)`);
    }
    const txt = msgs.join('\n');
    if (el.textContent !== txt) el.textContent = txt;
    el.style.display = txt ? 'block' : 'none';
  }

  async function requestWakeLock() {
    wakeWanted = true;
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) { wakeLock = null; }
  }

  function onNearEntry() {
    try { if (navigator.vibrate) navigator.vibrate(200); } catch (e) {}
    requestWakeLock();
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function keyOf(i) { return i.id + '\u0001' + i.name + '\u0001' + i.dong; }

  function setRadius(val) {
    searchRadius = val; localStorage.setItem('aptSearchRadius', val);
    const buttons = document.querySelectorAll('.rad-btn');
    buttons.forEach(btn => { btn.classList.toggle('active', btn.innerText === val + 'm'); });
    lastInAt.clear();          // 반경 변경 시 이탈 지연 초기화
    suppressNearFx = true;     // 반경 변경으로 늘어난 항목엔 진동 안 함

  }

  window.onpopstate = function(event) {
    if (document.getElementById('input-modal').style.display === 'block') { hideInputModal(); }

  function showMsg(msg, okCallback, showCancel = false, isPasswordMode = false) {

    document.getElementById('uni-msg').style.color = isPasswordMode ? "var(--error)" : "var(--accent)";
    document.getElementById('uni-no-btn').style.display = showCancel ? 'block' : 'none';
    
    const pwInput = document.getElementById('uni-pw-input');

    document.getElementById('uni-modal').style.display = 'block';

      if(okCallback) okCallback(inputPwValue);

  }
  
  function closeUniModal() { 
    document.getElementById('uni-pw-input').style.display = 'none';
    document.getElementById('uni-modal').style.display = 'none'; 
  }
  
  async function loadData() { 
    const localBackup = localStorage.getItem('offline_apt_db');
    if (localBackup) {
      try { allData = JSON.parse(localBackup); } catch (e) { allData = []; }
      onDataChanged();
    }
    const { data, error } = await sb.from('apt_passwords').select('*').order('created_at');
    if (error) { showMsg('데이터 로드 실패: ' + error.message); return; }
    const res = (data || []).map(r => ({ id: r.id, name: r.apt_name || '', dong: r.dong_line || '', pw: r.password || '', addr: r.address || '', lat: String(r.lat || ''), lon: String(r.lng || ''), note: r.notes || '' }));
    allData = res;
    localStorage.setItem('offline_apt_db', JSON.stringify(res));
    onDataChanged();
  }

  function onDataChanged() {
    dataVer++; prefetch.clear(); lastRender = null;
    prewarmJamo();   // P3: 오타 보정용 자모 분해 사전 캐싱
    if (coldView && coldView.needData) coldChecked = false;  // 데이터 로드 후 콜드 판정 재시도
    maybeFetchDestination();
    // 새 데이터 도착 시 기존 nomatch 배달 주소를 다시 매칭 (캐시 데이터로 실패했던 경우 구제)
    if (destRawAddr && destInfo && destInfo.type === 'nomatch') rematchDestination();
    refreshDisplay();
  }
  
  function switchMode(mode) {
    if (mode === 'main') document.getElementById('search-input').value = '';
    currentMode = mode;
    document.getElementById('btn-main').classList.toggle('active', mode === 'main');
    document.getElementById('btn-manage').classList.toggle('active', mode === 'manage'); 
    document.getElementById('search-wrap').style.display = (mode === 'manage') ? 'block' : 'none'; 
    document.getElementById('radius-box').style.display = (mode === 'main') ? 'flex' : 'none';
    lastRender = null;
    refreshDisplay();
    updateStatus();
  }

  function levenshtein(a, b) {
    let m = [], i, j, min = Math.min;
    if (!(a && b)) return (b || a).length;
    for (i = 0; i <= b.length; m[i] = [i++]);
    for (j = 0; j <= a.length; m[0][j] = j++);
    for (i = 1; i <= b.length; i++) {
      for (j = 1; j <= a.length; j++) {
        m[i][j] = b.charAt(i - 1) == a.charAt(j - 1) ? m[i - 1][j - 1] : m[i][j] = min(m[i - 1][j - 1] + 1, min(m[i][j - 1] + 1, m[i - 1][j] + 1));
      }
    }
    return m[b.length][a.length];
  }

  // 글자 오타 교정 스코어 계산 (100% 일치 실패 시에만 호출됨)
  // 한글 음절 → 초성 (원문 인덱스와 1:1 대응)
  const CHOSUNG = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  function getChosung(s) {
    let out = '';
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i) - 44032;
      out += (c >= 0 && c < 11172) ? CHOSUNG[Math.floor(c / 588)] : s[i];
    }
    return out;
  }

  // ===== P3: 자모 단위 가중 편집거리 (순수 함수) =====
  const JUNGSUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
  const JONGSUNG = ['', 'ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  // 한글 음절 → [초성, 중성, 종성('' 가능)], 그 외 문자 → [문자]
  function decomposeJamo(ch) {
    const s = String(ch), c = s.charCodeAt(0) - 44032;
    if (!(c >= 0 && c < 11172)) return [s];
    return [CHOSUNG[Math.floor(c / 588)], JUNGSUNG[Math.floor((c % 588) / 28)], JONGSUNG[c % 28]];
  }
  // 자모 치환 비용: 같으면 0, 혼동쌍(JAMO_SUB_COST)은 할인, 빈 종성('')이 끼면 1
  function jamoSubCost(a, b) {
    if (a === b) return 0;
    if (!a || !b) return 1;
    const k = [a, b].sort().join('');
    return Object.prototype.hasOwnProperty.call(JAMO_SUB_COST, k) ? JAMO_SUB_COST[k] : 1;
  }
  // 자모 배열 간 편집거리: 치환만 가중, 삽입/삭제 1
  function levenshteinWeighted(a, b) {
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    let prev = new Array(b.length + 1), cur = new Array(b.length + 1);
    for (let j = 0; j <= b.length; j++) prev[j] = j;
    for (let i = 1; i <= a.length; i++) {
      cur[0] = i;
      for (let j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j - 1] + jamoSubCost(a[i - 1], b[j - 1]), prev[j] + 1, cur[j - 1] + 1);
      }
      [prev, cur] = [cur, prev];
    }
    return prev[b.length];
  }
  // 문자열 → {flat: 자모 배열, off: 글자 i의 flat 시작 인덱스} (off.length = 글자수+1)
  function buildJamoSeq(s) {
    const flat = [], off = [0];
    for (let i = 0; i < s.length; i++) { decomposeJamo(s[i]).forEach(j => flat.push(j)); off.push(flat.length); }
    return { flat, off };
  }
  // 글자 [start, start+len) 구간의 자모 배열
  function jamoSlice(seq, start, len) { return seq.flat.slice(seq.off[start], seq.off[start + len]); }
  const jamoCache = new Map();   // DB 문자열 → buildJamoSeq 결과 (데이터 로드 시 prewarmJamo로 사전 계산)
  function jamoSeq(s) {
    let r = jamoCache.get(s);
    if (!r) { r = buildJamoSeq(s); jamoCache.set(s, r); }
    return r;
  }
  // getMatchScore 4단계가 비교하는 DB 측 문자열 (사전 캐싱과 공용)
  function matchLetterStrings(item) {
    const itemName = String(item.name || ''), itemDong = String(item.dong || '');
    return {
      targetLetters: (itemName + itemDong).toLowerCase().replace(/\s+/g, "").replace(/\d+/g, "").replace(/(단지|차)/g, ""),
      words: (itemName + ' ' + itemDong).toLowerCase().split(/\s+/).map(w => w.replace(/\d+/g, "").replace(/(단지|차)/g, "")),
    };
  }
  function prewarmJamo() {
    jamoCache.clear();
    (allData || []).forEach(i => { const m = matchLetterStrings(i); jamoSeq(m.targetLetters); m.words.forEach(w => jamoSeq(w)); });
  }

  // ===== P1: 음성 검색어 정규화 (순수 함수, 음성 경로 전용) =====
  const NATIVE_DIGIT = { '일': 1, '이': 2, '삼': 3, '사': 4, '오': 5, '육': 6, '칠': 7, '팔': 8, '구': 9 };
  const NATIVE_UNIT = { '십': 10, '백': 100, '천': 1000 };
  // 한글 수사 → 숫자: "백일"=101, "이"=2, "삼백"=300, "천이백삼십사"=1234. 수사 외 문자가 있으면 NaN
  function nativeToArabic(s) {
    let total = 0, cur = 0;
    for (const ch of String(s)) {
      if (NATIVE_DIGIT[ch]) cur = NATIVE_DIGIT[ch];
      else if (NATIVE_UNIT[ch]) { total += (cur || 1) * NATIVE_UNIT[ch]; cur = 0; }
      else return NaN;
    }
    return total + cur;
  }
  // 정상 수사인지: 숫자 연속 금지, 단위는 내림차순 ("구이"·"일이"는 비정상)
  function isWellFormedNumeral(s) {
    let prevDigit = false, lastUnit = Infinity;
    for (const ch of s) {
      if (NATIVE_DIGIT[ch]) { if (prevDigit) return false; prevDigit = true; }
      else if (NATIVE_UNIT[ch]) { if (NATIVE_UNIT[ch] >= lastUnit) return false; lastUnit = NATIVE_UNIT[ch]; prevDigit = false; }
      else return false;
    }
    return s.length > 0;
  }
  // 수사 연속부 중 가장 긴 정상 접미부만 변환 ("청구이차"의 "구이" → "구2")
  function convertNumeralRun(run) {
    for (let k = 0; k < run.length; k++) {
      const tail = run.slice(k);
      if (isWellFormedNumeral(tail)) return run.slice(0, k) + nativeToArabic(tail);
    }
    return run;
  }
  function normalizeVoiceQuery(q) {
    let s = String(q || '').replace(/[.?!,]+/g, ' ').replace(/\s+/g, ' ').trim();
    for (let changed = true; changed;) {
      changed = false;
      for (const w of VOICE_TRAILING_WORDS) {
        if (s.length > w.length && s.endsWith(w)) { s = s.slice(0, -w.length).trim(); changed = true; break; }
      }
    }
    return s.replace(/(일|이|삼|사|오|육|칠|팔|구|십|백|천)+(?=동|차|단지|호)/g, convertNumeralRun);
  }

  // ===== P2/P8: n-best 결합·후보 판정 (순수 함수) =====
  function voiceCombinedScore(score, confidence, rank) {
    if (Number.isFinite(confidence) && confidence > 0) return score * (VOICE_CONF_BASE + VOICE_CONF_W * confidence);
    return score * VOICE_RANK_DECAY[Math.min(rank, VOICE_RANK_DECAY.length - 1)];
  }
  // SpeechRecognitionResultList(유사 배열) → [{transcript, confidence, rank}] (확정 세그먼트만)
  function collectVoiceAlts(results) {
    const segs = [];
    for (let i = 0; i < results.length; i++) {
      const r = results[i];
      if (!r || !r.isFinal) continue;
      const alts = [];
      for (let j = 0; j < Math.min(r.length, VOICE_MAX_ALTS); j++) alts.push({ transcript: String(r[j].transcript || ''), confidence: r[j].confidence, rank: j });
      if (alts.length) segs.push(alts);
    }
    if (segs.length <= 1) return segs[0] || [];
    // 다중 세그먼트: 각 세그먼트 1순위 연결(기존 동작)을 0순위로, 한 세그먼트만 대안으로 바꾼 문자열을 그 대안 순위로
    const top = segs.map(s => s[0].transcript);
    const out = [{ transcript: top.join(''), confidence: Math.min(...segs.map(s => s[0].confidence || 0)), rank: 0 }];
    segs.forEach((s, k) => s.slice(1).forEach(a => {
      out.push({ transcript: top.map((t, x) => x === k ? a.transcript : t).join(''), confidence: a.confidence, rank: a.rank });
    }));
    return out;
  }
  // 대안별 정규화 → 검색 → 결합 점수(base 기준) 내림차순. 동점이면 위치 가산 큰 순 → 원래 순서. searchFn: searchItemsWithScores
  // 위치 가산은 동점 tiebreak로만 반영: 정확 일치 대안이 근처 오타 대안에 밀리지 않도록
  function rankVoiceAlts(alts, searchFn) {
    const seen = new Set(), out = [];
    alts.forEach((a, idx) => {
      const text = normalizeVoiceQuery(a.transcript);
      if (!text || seen.has(text)) return;
      seen.add(text);
      const scored = searchFn(text);
      const top = scored.length ? scored[0] : null;
      out.push({ text, idx, rank: a.rank, confidence: a.confidence, scored, top,
        combined: top ? voiceCombinedScore(top.base, a.confidence, a.rank) : 0,
        locBonus: top ? top.score - top.base : 0 });
    });
    return out.sort((x, y) => (y.combined - x.combined) || (y.locBonus - x.locBonus) || (x.idx - y.idx));
  }
  // [{item, score}] (점수순) → 단지명 중복 제거 [{name, score, addr}] 상위 n
  function topComplexes(scored, n) {
    const seen = new Set(), out = [];
    for (const s of scored) {
      const name = String(s.item.name || '');
      if (!name || seen.has(name)) continue;
      seen.add(name);
      out.push({ name, score: s.score, base: s.base, addr: String(s.item.addr || '') });
      if (out.length >= n) break;
    }
    return out;
  }
  // 'expand' = 바로 펼침, 'candidates' = 후보 선택 UI, 'none' = 매칭 없음(P5 폴백)
  // 게이트는 가산 전 base로 판단: 위치 가산이 오타 수준 매칭을 게이트 위로 밀어올려 확인 없이 자동 펼치는 문제 방지.
  // 위치는 순위(칩 순서)에만 반영하고, P8의 '명확할 때만 펼침'은 매칭 자체의 확실성으로만 결정한다.
  function decideVoiceAction(cands) {
    if (!cands || !cands.length) return 'none';
    const t1 = cands[0], t2 = cands[1];
    if (t1.base >= VOICE_CLEAR_SCORE && (!t2 || t1.base - t2.base >= VOICE_CLEAR_GAP)) return 'expand';
    return 'candidates';
  }
  // 위치 가산 = 신선도 × 정확도. acc: 측위 accuracy(m), ageMs: 위치 나이, dist: 단지까지 거리(m)
  // 브라우저 Geolocation API는 측위 원천(GPS/WiFi/기지국)을 직접 알려주지 않으므로 accuracy 숫자로 추정한다.
  function voiceLocBonus(acc, ageMs, dist) {
    if (!Number.isFinite(acc) || !Number.isFinite(ageMs) || !Number.isFinite(dist)) return 0;
    if (ageMs > VOICE_POS_FRESH_MS) return 0;
    const tbl = acc <= VOICE_ACC_GPS_M ? VOICE_LOC_BONUS_GPS : acc <= VOICE_ACC_WIFI_M ? VOICE_LOC_BONUS_WIFI : VOICE_LOC_BONUS_CELL;
    return dist <= VOICE_LOC_NEAR_M ? tbl[0] : dist <= VOICE_LOC_MID_M ? tbl[1] : dist <= VOICE_LOC_FAR_M ? tbl[2] : 0;
  }

  // [2단계] 토큰 순서 매칭: "펜타 한신 2차" → "펜타시티 한신더휴 2차" (중간 단어 생략 허용)
  // 건물명 의미 토큰(item.name 내 2글자 이상, 1음절·숫자·동/호수/차수/단지 등 제외)이 1개 이상 매칭되면
  // 호수/동/숫자 불일치(-5) 및 일반 단어 불일치(-6) 시 탈락시키지 않고 감점 적용
  function tokenSubseqScore(rawQuery, item) {
    const tokens = String(rawQuery).toLowerCase().split(/\s+/).filter(t => t.length > 0);
    if (tokens.length < 2) return 0;
    const nameTarget = String(item.name || '').toLowerCase();
    // 차수 충돌 게이트: 차수(2차/4차)는 단지명의 일부이자 실제로 다른 단지(주소 다름).
    // 검색어에 차수가 있으면 후보 단지명도 같은 차수여야 함 (없거나 다르면 탈락).
    // ※ 스케치(qCha && nCha && ...)에서 강화: 차수 없는 후보도 제외해야
    //   '한신 2차 205동' → '펜타시티 한신더휴 2차' 단일 매칭이 성립함.
    //   과탈락 시 하위 티어(초성→오타보정)로 폴백되므로 안전.
    // 동/호수(205동·403호)는 호실 정보라 기존 감점 유지.
    const qCha = (String(rawQuery).match(/([0-9]+)\s*차/) || [])[1];
    const nCha = (String(item.name || '').match(/([0-9]+)\s*차/) || [])[1];
    if (qCha && qCha !== nCha) return 0;
    const qNoSpace = String(rawQuery).toLowerCase().replace(/\s+/g, '');
    const nNoSpace = nameTarget.replace(/\s+/g, '');
    const nTokens = nameTarget.split(/\s+/).filter(t => t.length >= 3 && !/^\d+차$/.test(t));
    const revMatch = nNoSpace.length >= 4 && qNoSpace.includes(nNoSpace);
    const tokenRevMatch = nTokens.some(nt => qNoSpace.includes(nt));
    const target = (item.name + ' ' + item.dong + ' ' + item.addr).toLowerCase();
    let pos = 0, matched = 0, penalty = 0, meaningful = (revMatch || tokenRevMatch) ? 1 : 0;
    for (const tk of tokens) {
      const core = tk.replace(/[0-9.-]+(동|호|차|단지|층|번길|번지|번|라인)?/g, '').replace(/^[a-z가-힣](동|호|차|단지|층|라인)$/, '');
      const idx = target.indexOf(tk, pos);
      if (idx < 0) {
        penalty += core.length < 2 ? 5 : 6;
        continue;
      }
      matched++;
      pos = idx + tk.length;
      if (core.length >= 2 && idx + tk.length <= nameTarget.length) meaningful++;
    }
    if (meaningful === 0) return 0;
    return Math.max(0, 40 + matched * 5 - penalty);
  }

  // [3단계] 초성 매칭: "ㅍㅌㅅㅌ" → "펜타시티"
  function chosungScore(rawQuery, item) {
    const q = String(rawQuery).replace(/\s+/g, '');
    if (!q || !/^[ㄱ-ㅎ]+$/.test(q)) return 0;
    const target = getChosung(String(item.name + item.dong).replace(/\s+/g, ''));
    const idx = target.indexOf(q);
    return idx < 0 ? 0 : (idx === 0 ? 35 : 30);
  }

  function getMatchScore(query, item) {
    const itemName = String(item.name || '');
    const itemDong = String(item.dong || '');
    const targetStr = (itemName + itemDong + String(item.addr || '')).toLowerCase().replace(/\s+/g, "");
    const nameStr = itemName.toLowerCase().replace(/\s+/g, "");

    // [4단계] 오타 보정 — "N단지"/"N차" 지정이 있으면 이름 기준으로 엄격 판정
    const qDesig = query.match(/(\d+)(단지|차)/);
    if (qDesig) {
      const nDesig = nameStr.match(/(\d+)(단지|차)/);
      if (nDesig && nDesig[1] !== qDesig[1]) return 0;  // "2단지" 쿼리에 "1단지"는 제외
      if (!nameStr.includes(qDesig[1])) return 0;        // 이름에 숫자 자체가 없으면 제외 (동/주소의 숫자는 안 됨)
    } else {
      // 숫자가 틀리면 무조건 탈락 (오타 검사 제외)
      const queryNums = query.match(/\d+/g);
      if (queryNums) {
        for (let i = 0; i < queryNums.length; i++) {
          if (!targetStr.includes(queryNums[i])) return 0;
        }
      }
    }

    // "대박2단지" → "대박" (단지/차 접미사는 이름 매칭에서 제외)
    const queryLetters = query.replace(/\d+/g, "").replace(/(단지|차)+$/, "");
    if (queryLetters.length < 2) return 0; // 한 글자는 오타 검사 안 함

    const len = queryLetters.length;
    const maxErr = len <= 3 ? 1 : 2;
    let bestDist = 999;
    // P3: 거리 = min(음절 거리, 자모 가중 거리) — 기존 음절 거리로 통과하던 매칭은 그대로 통과(텍스트 검색 보존),
    // 혼동 자모(ㅂ/ㅍ, ㅐ/ㅔ, 받침 ㅇ/ㄱ 등)만 추가 할인. 자모 거리 단독으로는 음절 누락("펜타대박"↔"펜타시티" 2→5)을 탈락시킴
    const qJamo = buildJamoSeq(queryLetters).flat;
    const ml = matchLetterStrings(item);

    if (len <= 2) {
      // 짧은 쿼리는 단어 시작 위치에서만 매칭 ("대박"→"대방" O, "대박"→"현대아이파크 속 대아" X)
      const words = ml.words.filter(w => w.length >= len);
      for (const w of words) {
        const dist = Math.min(levenshtein(queryLetters, w.substr(0, len)), levenshteinWeighted(qJamo, jamoSlice(jamoSeq(w), 0, len)));
        if (dist < bestDist) bestDist = dist;
      }
    } else {
      // 이름+동 안에서만 매칭 (주소는 제외 — 주소 오타 매칭이 쓰레기 결과의 주범)
      const targetLetters = ml.targetLetters;
      if (len <= targetLetters.length) {
        const tSeq = jamoSeq(targetLetters);
        for (let i = 0; i <= targetLetters.length - len; i++) {
          const dist = Math.min(levenshtein(queryLetters, targetLetters.substr(i, len)), levenshteinWeighted(qJamo, jamoSlice(tSeq, i, len)));
          if (dist < bestDist) bestDist = dist;
        }
      }
    }

    if (bestDist <= maxErr) {
      return 50 - bestDist;
    }
    return 0;
  }


  // 음성 검색: SpeechRecognition 지원 브라우저에서만 마이크 버튼 노출
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) document.getElementById('mic-btn').style.display = 'block';
  let rec = null, recListening = false;

  function setMicListening(on) {
    recListening = on;
    document.getElementById('mic-btn').classList.toggle('listening', on);
  }

  function toggleVoice() {
    if (recListening) { try { rec.stop(); } catch (e) {} setMicListening(false); return; }
    const input = document.getElementById('search-input');
    rec = new SR();
    rec.lang = 'ko-KR'; rec.interimResults = true; rec.maxAlternatives = VOICE_MAX_ALTS;
    rec.onresult = (ev) => {
      let finalT = '', interim = '';
      for (let i = 0; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) finalT += ev.results[i][0].transcript;
        else interim += ev.results[i][0].transcript;
      }
      input.value = finalT + interim;
      if (!interim && finalT) handleVoiceFinal(input, ev.results, finalT);
    };
    rec.onerror = (e) => {
      setMicListening(false);
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') showMsg('설정에서 마이크 권한을 허용해 주세요');
      else if (e.error === 'no-speech') showMsg('음성이 감지되지 않았어요');
      else if (e.error !== 'aborted') showMsg('음성 인식 오류: ' + e.error);
    };
    const r = rec;   // 빠르게 재시작 시 이전 인스턴스의 늦은 onend가 새 인스턴스를 지우지 않게
    rec.onend = () => { if (rec !== r) return; setMicListening(false); rec = null; };
    try { rec.start(); setMicListening(true); } catch (e) { setMicListening(false); }
  }
  document.getElementById('mic-btn').addEventListener('click', toggleVoice);

  // 음성 토큰 드롭 폴백: 확실한 매칭이 없을 때 DB 888행 어디에도 없는 토큰(오인식)을 버리고 재검색
  // 예: "1시 2차 204동" → "1시"는 DB에 없음 → 버림 → "2차 204동"으로 재검색
  function voiceTokenDropMerge(text, cands) {
    const seen = new Set();
    const out = [];
    const pushAll = (list) => {
      for (const c of list) {
        if (out.length >= VOICE_CAND_N) break;
        if (!c || !c.name || seen.has(c.name)) continue;
        seen.add(c.name);
        out.push(c);
      }
    };
    const toks = String(text || '').toLowerCase().split(/\s+/).filter(t => t.length);
    if (toks.length >= 2) {
      const hay = (i) => String(i.name || '') + String(i.dong || '') + String(i.addr || '');
      const garbage = toks.filter(t => !allData.some(i => hay(i).toLowerCase().includes(t)));
      if (garbage.length > 0 && garbage.length < toks.length) {
        const kept = toks.filter(t => garbage.indexOf(t) < 0).join(' ');
        pushAll(topComplexes(searchItemsWithScores(kept), VOICE_CAND_N));
      }
    }
    pushAll(cands || []);
    return out;
  }

  // 음성 확정: P1 정규화 → P2 n-best 결합 → P8 명확성 게이트 (expand / candidates / none→P5)
  function handleVoiceFinal(input, results, finalT) {
    const ranked = currentMode === 'manage' ? rankVoiceAlts(collectVoiceAlts(results), searchItemsWithScores) : [];
    if (!ranked.length) { voiceDongPin = []; voicePinOff = false; input.value = finalT.trim(); input.focus(); refreshDisplay(); return; }  // 기존 흐름
    const best = ranked[0];
    voiceDongPin = voiceDongPins(best.text);
    voicePinOff = false;
    input.value = best.text;
    voiceView = null;
    const cands = topComplexes(best.scored, VOICE_CAND_N);
    const vAction = decideVoiceAction(cands);
    if (vAction !== 'expand') {
      const merged = voiceTokenDropMerge(best.text, cands);
      if (merged.length) {
        voiceQuery = null;
        renderVoiceCandidates(document.getElementById('list-container'), best.text, merged);
        return;
      }
    }
    // 'candidates' 분기 제거: 위 병합 결과에 cands가 항상 포함돼 merged가 비지 않으므로 도달 불가
    voiceQuery = { text: best.text, alts: ranked.slice(1).filter(r => r.top).map(r => ({ text: r.text, name: String(r.top.item.name || '') })), pinDongs: voiceDongPin };
    input.focus(); refreshDisplay();
  }

  function voiceHeardHtml(text) { return `<div class="voice-heard">들은 내용: <b>${esc(text)}</b></div>`; }

  // 음성 동 핀: "불의 날 115동" → ['115동'] (DB의 name+dong+addr에 존재하는 토큰만, 중복 제거·순서 유지)
  function voiceDongPins(text) {
    const out = [];
    String(text || '').split(/\s+/).forEach(t => {
      if (!/^\d+동$/.test(t) || out.includes(t)) return;
      if ((allData || []).some(i => (String(i.name || '') + String(i.dong || '') + String(i.addr || '')).includes(t))) out.push(t);
    });
    return out;
  }
  function dongPinIndex(dong, pins) {
    const d = String(dong || '').trim();
    for (let k = 0; k < (pins || []).length; k++) { if (d === pins[k] || d.startsWith(pins[k] + ' ')) return k; }
    return 999;
  }
  function sortByDongPin(items, pins) {
    if (!pins || !pins.length || !items.some(i => dongPinIndex(i.dong, pins) < 999)) return items.slice().sort(cmpDong);
    return items.slice().sort((a, b) => (dongPinIndex(a.dong, pins) - dongPinIndex(b.dong, pins)) || cmpDong(a, b));
  }
  // 위치 폴백: coarse 위치 기준 가까운 단지 n개 [{name, d}] (좌표 없는 단지 제외)
  function voiceNearbyComplexes(lat, lon, n) {
    const seen = new Set(), out = [];
    complexNames().map(name => ({ name, d: complexMinDist(name, lat, lon) }))
      .filter(c => c.d < 999999)
      .sort((a, b) => (a.d - b.d) || a.name.localeCompare(b.name, 'ko'))
      .forEach(c => { if (!seen.has(c.name) && out.length < n) { seen.add(c.name); out.push(c); } });
    return out;
  }

  // P8: 인식 후보 선택 UI — 칩 선택 시 해당 단지 전체 동 (운행 모드 단지 선택 화면, 동 오름차순)
  function renderVoiceCandidates(container, text, cands) {
    voiceCandList = cands.map(c => c.name);
    voicePinOff = false;
    // 음성 동 핀: cands 순위대로 핀 동이 있는 첫 단지에서 핀 인덱스가 가장 작은 동 1개 행
    let topHtml = '';
    const pins = voiceDongPin;
    if (pins && pins.length && cands.length) {
      for (const c of cands) {
        let bestItem = null, bestP = 999;
        complexItems(c.name).forEach(item => { const p = dongPinIndex(item.dong, pins); if (p < bestP) { bestP = p; bestItem = item; } });
        if (bestItem) { topHtml = cardHtml({ item: bestItem, d: 999999, near: false }, true); break; }
      }
    }
    const html = voiceHeardHtml(text) + topHtml +
      `<div class="cold-sec">유사단지</div><div class="chip-row">` +
      cands.map((c, i) => { const sa = shortAddr(c.addr); return `<button class="chip" onclick="pickVoiceCand(${i})">${esc(c.name)}${sa ? ` <small>(${esc(sa)})</small>` : ''}</button>`; }).join('') +
      `</div><div class="chip-row voice-all-row"><button class="chip" onclick="showVoiceAllResults()">텍스트로 다시 검색</button></div>`;
    voiceView = { text, html };
    lastRender = null;
    container.innerHTML = html;
  }
  function pickVoiceCand(i) {
    const name = voiceCandList[i];
    if (!name) return;
    voiceView = null; voiceQuery = null;
    const pins = voicePinOff ? [] : voiceDongPin;
    voicePinOff = false;
    if (currentMode !== 'main') switchMode('main');   // 단지 전체 동 화면은 운행 모드 래치 뷰
    showComplexRows(name, pins);
  }
  function showVoiceAllResults() { voiceView = null; voiceQuery = null; refreshDisplay(); }

  // P5: 음성 무매칭 폴백 — 들은 내용 + 초성 유사 단지 + n-best 차순위
  function voiceChosungSuggest(text, n) {
    const qs = [];
    const full = getChosung(String(text).replace(/\s+/g, '')).replace(/[^ㄱ-ㅎ]/g, '');
    if (full.length >= 2) qs.push(full);
    String(text).split(/\s+/).forEach(t => { const c = getChosung(t).replace(/[^ㄱ-ㅎ]/g, ''); if (c.length >= 2 && !qs.includes(c)) qs.push(c); });
    const out = [];
    for (const q of qs) {
      const hits = (allData || []).map(i => ({ item: i, score: chosungScore(q, i) })).filter(h => h.score > 0)
        .sort((a, b) => (b.score - a.score) || String(a.item.name).localeCompare(String(b.item.name)));
      for (const h of hits) {
        const name = String(h.item.name || '');
        if (name && !out.includes(name)) out.push(name);
        if (out.length >= n) return out;
      }
    }
    return out;
  }
  function renderVoiceNoMatch(container, vq) {
    const sugg = voiceChosungSuggest(vq.text, VOICE_SUGGEST_N);
    const altNames = [];
    (vq.alts || []).forEach(a => { if (a.name && !sugg.includes(a.name) && !altNames.includes(a.name)) altNames.push(a.name); });
    const alts = altNames.slice(0, VOICE_ALT_CHIP_N);
    voiceSuggestList = sugg.concat(alts);
    let html = voiceHeardHtml(vq.text) + `<div class="voice-nomatch">검색 결과가 없습니다.</div>`;
    if (sugg.length) html += `<div class="cold-sec">유사 단지 추천</div><div class="chip-row">` +
      sugg.map((n, i) => `<button class="chip" onclick="pickVoiceSuggest(${i})">${esc(n)}</button>`).join('') + `</div>`;
    if (alts.length) html += `<div class="cold-sec">다른 인식 결과</div><div class="chip-row">` +
      alts.map((n, i) => `<button class="chip" onclick="pickVoiceSuggest(${sugg.length + i})">혹시 '${esc(n)}'인가요?</button>`).join('') + `</div>`;
    // 위치 폴백: 신선한 coarse 위치가 있으면 주변 단지 칩 (핀 미적용)
    const ageMs = coarseT == null ? Infinity : Date.now() - coarseT;
    if (Number.isFinite(coarseLat) && Number.isFinite(coarseLon) && ageMs <= VOICE_POS_FRESH_MS) {
      const near = voiceNearbyComplexes(coarseLat, coarseLon, VOICE_CAND_N);
      if (near.length) {
        voiceCandList = near.map(c => c.name);
        voicePinOff = true;
        html += `<div class="cold-sec">📍 주변 단지</div><div class="chip-row">` +
          near.map((c, i) => `<button class="chip" onclick="pickVoiceCand(${i})">${esc(c.name)} <small>(약 ${Math.round(c.d)}m)</small></button>`).join('') + `</div>`;
      }
    }
    voiceView = { text: vq.text, html };
    container.innerHTML = html;
  }
  function pickVoiceSuggest(i) { const n = voiceSuggestList[i]; if (n) pickVoiceName(n); }
  function pickVoiceName(name) {
    voiceQuery = null; voiceView = null;
    if (currentMode !== 'main') switchMode('main');   // 단지 전체 동 화면은 운행 모드 래치 뷰
    showComplexRows(name, voiceDongPin);
  }

  // PWA 홈 화면 설치
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
  // 텍스트 선택 방지: 입력란 제외하고 길게누르기 메뉴 차단
  document.addEventListener('contextmenu', function(e) {
    if (!/INPUT|TEXTAREA/.test((e.target && e.target.tagName) || '')) e.preventDefault();
  });
  document.getElementById('install-btn').addEventListener('click', async () => {
    if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; }
    else { showMsg('Android: ⋮ 메뉴 → 홈 화면에 추가 / iPhone: 공유 버튼 → 홈 화면에 추가'); }
  });
  if (window.matchMedia('(display-mode: standalone)').matches) { document.getElementById('install-btn').style.display = 'none'; }

  // 검색 엔진 (메인 검색·콜드 검색 공용). rawQuery: 입력 원문. 반환: 매칭 행 배열 (순위순)
  // 반환: [{item, base, score}] (score순). base = 매칭 점수(가산 전), score = base + P4 위치 가산
  function searchItemsWithScores(rawQuery) {
    // 중복 토큰 제거 (2026-10-17): "107동 107동" → "107동" — 중복 토큰이 검색 실패 유발
    const dedupedQuery = String(rawQuery || '').split(/\s+/).filter((t, i, a) => t && a.indexOf(t) === i).join(' ');
    const searchVal = dedupedQuery.toLowerCase().replace(/\s+/g, "");
    if (!searchVal) return [];
    // [1단계 필터] 검색어와 100% 완벽하게 일치하는 데이터 먼저 탐색
    let exactMatches = allData.filter(i => {
      const targetStr = (i.name + i.dong + i.addr).toLowerCase().replace(/\s+/g, "");
      return targetStr.includes(searchVal);
    });

    let scoredItems = [];
    if (exactMatches.length > 0) {
      // 정확히 일치하는 데이터(포레나 101동)가 발견되면, 오타 알고리즘(샬레 101동) 가동 완전 차단.
      // 위치 가산은 다른 매칭 타입과 동일 적용 → 정확+근접(60+25)이 항상 오타+근접(35+25)보다 위
      scoredItems = exactMatches.map(i => ({ item: i, base: EXACT_MATCH_SCORE }));
    } else {
      // [2단계] 토큰 순서 매칭("펜타 한신 2차"→"펜타시티 한신더휴 2차") → [3단계] 초성 → [4단계] 오타 보정 (앞 단계 결과가 있으면 뒤 단계는 계산 안 함)
      const tiers = [
        () => allData.map(i => ({ item: i, base: tokenSubseqScore(dedupedQuery, i) })),
        () => allData.map(i => ({ item: i, base: chosungScore(dedupedQuery, i) })),
        () => allData.map(i => ({ item: i, base: getMatchScore(searchVal, i) })),
      ];
      for (const t of tiers) {
        scoredItems = t().filter(h => h.base > 0);
        if (scoredItems.length) break;
      }
    }

    // [P4] 위치 가산 (신선도 × 정확도, coarse 위치 기준)
    const ageMs = coarseT == null ? Infinity : Date.now() - coarseT;
    scoredItems.forEach(h => { h.score = h.base + voiceLocBonus(coarseAcc, ageMs, getDist(h.item.lat, h.item.lon, coarseLat, coarseLon)); });

    scoredItems.sort((a, b) => {
      if (b.score !== a.score) return b.score - a.score;
      return a.item.name.localeCompare(b.item.name);
    });

    return scoredItems;
  }
  function searchItems(rawQuery) { return searchItemsWithScores(rawQuery).map(d => d.item); }

  function refreshDisplay() {
    const container = document.getElementById('list-container');
    const searchVal = document.getElementById('search-input').value.toLowerCase().replace(/\s+/g, "");
    
    if (!allData || allData.length === 0) return;

    let filtered = [];
    if (currentMode === 'main') {
      renderMain(container);
      return;
    } else {
      const rawVal = document.getElementById('search-input').value;
      if (searchVal && voiceView && rawVal === voiceView.text) { container.innerHTML = voiceView.html; lastRender = null; return; }  // 음성 후보/무매칭 화면 유지
      voiceView = null;
      if (searchVal) {
        filtered = searchItems(rawVal);
      } else {
        filtered = [...allData].sort((a,b) => a.name.localeCompare(b.name));
      }
    }

    lastRender = null;
    const hasFix = Number.isFinite(myLat) && Number.isFinite(myLon);
    const rows = filtered.map(item => {
      const d = hasFix ? getDist(item.lat, item.lon) : 999999;
      return { item, d, near: hasFix && d <= searchRadius };
    });
    const vq = voiceQuery;
    voiceQuery = null;   // P5: 1회 소비
    const rawVal = document.getElementById('search-input').value;
    if (!searchVal) {
      searchFoldState = { qKey: '', expanded: false, pins: [] };
    } else if (searchFoldState.qKey !== searchVal) {
      searchFoldState = { qKey: searchVal, expanded: false, pins: (vq && vq.pinDongs) ? vq.pinDongs.slice() : [] };
    } else if (vq && vq.pinDongs && vq.pinDongs.length) {
      searchFoldState.pins = vq.pinDongs.slice();
    }
    if (rows.length === 0 && searchVal && vq) {
      renderVoiceNoMatch(container, vq);
    } else if (rows.length === 0) {
      container.innerHTML = `<div style="color:#555; text-align:center; margin-top:50px;">${searchVal ? '검색 결과가 없습니다.' : '주변 ' + searchRadius + 'm 이내 없음'}</div>`;
    } else {
      const uniqNames = [...new Set(filtered.map(i => String(i.name || '')).filter(Boolean))];
      const pins = searchFoldState.pins || [];
      if (searchVal && uniqNames.length === 1) {
        const allCItems = complexItems(uniqNames[0]);
        const pinnedItems = matchSearchDongItems(rawVal, allCItems, pins);
        if (pinnedItems.length > 0 && allCItems.length > pinnedItems.length) {
          const pinnedSet = new Set(pinnedItems);
          const restItems = allCItems.filter(i => !pinnedSet.has(i)).sort((a, b) => cmpDong(a, b));
          const toRow = item => {
            const d = hasFix ? getDist(item.lat, item.lon) : 999999;
            return { item, d, near: hasFix && d <= searchRadius };
          };
          const pinnedHtml = pinnedItems.slice().sort((a, b) => cmpDong(a, b)).map(i => cardHtml(toRow(i), true)).join('');
          const restHtml = restItems.map(i => cardHtml(toRow(i), true)).join('');
          if (!searchFoldState.expanded) {
            container.innerHTML = pinnedHtml + '<button class="dest-expand-btn" onclick="expandSearchDong()">전체 동 펼치기 (' + restItems.length + '개)</button>';
          } else {
            container.innerHTML = pinnedHtml + '<button class="dest-expand-btn" onclick="collapseSearchDong()">접기</button>' + restHtml;
          }
          return;
        }
      }
      const pinned = pins.length && rows.some(r => dongPinIndex(r.item.dong, pins) < 999)
        ? rows.map((r, k) => ({ r, k, p: dongPinIndex(r.item.dong, pins) })).sort((a, b) => (a.p - b.p) || cmpDong(a.r.item, b.r.item)).map(x => x.r)
        : rows;   // 음성 동 핀: 해당 동 우선, 나머지는 cmpDong 오름차순
      container.innerHTML = pinned.map(r => cardHtml(r, true)).join('');
    }
  }
  let searchFoldState = { qKey: '', expanded: false, pins: [] };
  function matchSearchDongItems(rawQuery, items, pins) {
    const tokens = [];
    (pins || []).forEach(p => { if (p && !tokens.includes(p)) tokens.push(p); });
    const m = String(rawQuery || '').match(/(\d{1,4})\s*동/g);
    if (m) m.forEach(x => { const d = x.replace(/\s+/g, ''); if (!tokens.includes(d)) tokens.push(d); });
    String(rawQuery || '').split(/\s+/).forEach(t => {
      if (!t) return;
      const tl = t.toLowerCase();
      if (items.some(i => { const d = String(i.dong || '').trim().toLowerCase(); return d && (d === tl || d.startsWith(tl + ' ')); })) {
        if (!tokens.includes(tl)) tokens.push(tl);
      }
    });
    if (!tokens.length) return [];
    return items.filter(i => {
      const d = String(i.dong || '').trim();
      const dn = d.replace(/\s+/g, '').toLowerCase();
      return d && tokens.some(tk => {
        const tkn = String(tk).replace(/\s+/g, '').toLowerCase();
        return dn === tkn || dn.indexOf(tkn) === 0 || tkn.indexOf(dn) === 0 || d.toLowerCase().startsWith(String(tk).toLowerCase() + ' ');
      });
    });
  }
  function expandSearchDong() { searchFoldState.expanded = true; refreshDisplay(); }
  function collapseSearchDong() { searchFoldState.expanded = false; refreshDisplay(); }

  // ===== 콜드스타트: GPS 미확보 상태에서 WPS(WiFi 측위) 기반 단지 순위화 / 단지 선택 =====
  // 이전 위치·저장 단지는 절대 복원하지 않는다 (전지역 이동 사용자 실측 실패)
  function coldBootCheck() {
    coldChecked = true;
    if (!allData || allData.length === 0) { coldView = { type: 'hybrid', wpsPending: false, needData: true }; return; }
    coldView = { type: 'wps-pending', wpsPending: true, wpsCands: [] };
    if (navigator.geolocation) {
      try {
        navigator.geolocation.getCurrentPosition(onColdWpsOk, onColdWpsErr,
          { enableHighAccuracy: false, timeout: 2500, maximumAge: 3000 });
        return;
      } catch (e) {}
    }
    onColdWpsErr();
  }
  function onColdWpsOk(p) {
    if (coldDismissed) return;
    if (latch || (Number.isFinite(myLat) && Number.isFinite(myLon))) return; // 이미 단지 선택됐거나 실측 위치 확보
    const c = (p && p.coords) || {};
    const lat = c.latitude, lon = c.longitude;
    const acc = Number.isFinite(c.accuracy) ? c.accuracy : 99999;
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) { onColdWpsErr(); return; }
    // IME 보호: 검색창에 포커스가 있으면 WPS 응답 후 포커스 복원
    const searchFocused = document.activeElement && document.activeElement.id === 'cold-search';
    coldView = coldView || { type: 'hybrid' };
    coldView.wpsPending = false;
    const ranked = wpsCandidates(lat, lon, acc);
    coldView.wpsLat = lat; coldView.wpsLon = lon; coldView.wpsAcc = acc;
    let dec = decideWpsAction(ranked, acc);
    // Sanity Gate (2026-10-17): WPS 위치가 앵커 대비 비정상 점프면 자동 선택 금지 → 수동 선택으로 강등
    if (dec.action === 'auto') {
      const gate = isPlausibleFromAnchor(lat, lon, acc, Date.now(), true);
      if (!gate.ok) {
        dec = { action: 'pick' };
        coldView.wpsJumpSuspect = true;
      }
    }
    if (dec.action === 'auto' && doWpsAutoSelect(dec.name, lat, lon, acc)) {
      if (searchFocused) { const si = document.getElementById('cold-search'); if (si) si.focus(); }
      return;
    }
    if (dec.action === 'auto' || dec.action === 'pick') {
      coldView.type = 'wps-pick';
      coldView.wpsCands = coldWpsList = ranked.slice(0, WPS_CANDIDATE_N);
    } else {
      coldView.type = 'hybrid';
      coldView.wpsCands = coldWpsList = [];
    }
    refreshDisplay();
    if (searchFocused) { const si = document.getElementById('cold-search'); if (si) si.focus(); }
  }
  function onColdWpsErr() {
    if (latch || (Number.isFinite(myLat) && Number.isFinite(myLon))) return;
    const searchFocused = document.activeElement && document.activeElement.id === 'cold-search';
    coldView = coldView || { type: 'hybrid' };
    coldView.wpsPending = false;
    coldView.type = 'hybrid';
    refreshDisplay();
    if (searchFocused) { const si = document.getElementById('cold-search'); if (si) si.focus(); }
  }
  // WPS 1위 단지 자동 선택: 측위 성공 시 가까운 동만 거리순 표시 (거리는 WPS 위치 기준). 성공 시 true
  function doWpsAutoSelect(name, lat, lon, acc) {
    if (coldDismissed || currentMode !== 'main' || !name) return false;
    const all = complexItems(name).map(item => {
      const d = getDist(item.lat, item.lon, lat, lon);
      return { item, d, near: d <= searchRadius };
    });
    if (!all.length) return false;
    // 신호 끊김 지역이 아니면 가까운 동만 표시 (예전처럼 거리순). 나머지는 접어둠
    const R = Math.max(searchRadius, acc);
    let rows = all.filter(r => r.d <= R).sort((a, b) => a.d - b.d);
    let collapsed = false, allItems = null;
    if (rows.length < all.length) {
      if (!rows.length) rows = all.slice().sort((a, b) => a.d - b.d).slice(0, 5); // 안전장치: 가장 가까운 5개
      collapsed = true;
      // GPS가 튈 수 있으니 펼친 전체 목록은 거리순이 아닌 동 오름차순 (수동 찾기용)
      allItems = all.slice().sort((a, b) => cmpDong(a.item, b.item));
    }
    latch = { items: rows, names: [name], since: Date.now(), kind: 'wps', wpsAcc: Math.round(acc), rank: null, collapsed, allItems };
    latchFilter = null; coldView = null; coldAnchor = null; coldGoodStreak = 0;
    lastRender = null;
    refreshDisplay();
    return true;
  }
  function toggleWpsExpand() {
    if (!latch || latch.kind !== 'wps' || !latch.collapsed || !latch.allItems) return;
    latch.collapsedItems = latch.items;  // 펼치기 전 목록 저장 (접기 버튼 위치용)
    latch.items = latch.allItems; latch.collapsed = false;
    lastRender = null;
    refreshDisplay();
  }
  function collapseWps() {
    if (!latch || latch.kind !== 'wps' || latch.collapsed || !latch.collapsedItems) return;

  async function geocodeAddress(addr) {
    try {
      const q = encodeURIComponent('경북 포항시 ' + String(addr||'').replace(/^경북\s*포항시\s*/, ''));
      const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1&countrycodes=kr`, {
        headers: { 'Accept': 'application/json' }

      const data = await r.json();
      if (data && data.length > 0) {
        return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };

    } catch (e) { /* 지오코딩 실패는 무시 */ }
    return null;

  function findNearestByCoords(lat, lng, maxDistM = 100) {
    let best = null, bestDist = maxDistM;
    (allData||[]).forEach(it => {
      const ilat = parseFloat(it.lat), ilng = parseFloat(it.lng);
      if (!ilat || !ilng) return;
      // Haversine 거리 (m)
      const R = 6371000;
      const dLat = (ilat - lat) * Math.PI / 180;
      const dLng = (ilng - lng) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat*Math.PI/180) * Math.cos(ilat*Math.PI/180) * Math.sin(dLng/2)**2;
      const d = 2 * R * Math.asin(Math.sqrt(a));
      if (d < bestDist) { bestDist = d; best = it; }
    });
    return best ? { name: best.name, dist: Math.round(bestDist) } : null;
  }

  async function matchByCoords(addr) {

  function matchAddressToComplex(addr) {
    const norm = s => String(s||'').replace(/\s+/g,'').replace(/경상북도/g,'경북');

  function extractDong(addr) {
