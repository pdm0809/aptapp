<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서비스 종료 안내</title>
<style>
  body { margin:0; background:#111; color:#eee; font-family:sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .box { text-align:center; padding:24px; }
  h1 { font-size:20px; margin:0 0 12px; }
  p { font-size:14px; color:#aaa; margin:0; line-height:1.6; }
</style>
<script>
  // 이 페이지가 열리면 기기에 남은 앱 데이터(로컬 저장소·캐시·서비스워커)를 전부 지운다.
  try { localStorage.clear(); } catch (e) {}
  try { sessionStorage.clear(); } catch (e) {}
  if (window.caches && caches.keys) {
    caches.keys().then(function (keys) {
      keys.forEach(function (k) { caches.delete(k); });
    }).catch(function () {});
  }
  if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (r) { r.unregister(); });
    }).catch(function () {});
  }
</script>
</head>
<body>
  <div class="box">
    <h1>서비스가 종료되었습니다</h1>
    <p>이 앱은 더 이상 사용할 수 없습니다.<br>홈 화면의 바로가기를 삭제해 주세요.</p>
  </div>
</body>
</html>
