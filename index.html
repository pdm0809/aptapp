  }
  // Degraded 모드 렌더 (2026-10-17): 정확도 불량 위치를 어림 위치로 표시
  // 자동선택·래치·앵커·lastGood에는 사용 안 함 (표시 전용)
  let degradedNameList = [];
  function pickDegraded(i) {
    const n = degradedNameList[i];
    if (n) showComplexRows(n);
  }
  function renderDegradedView(container) {
    const d = degradedPos;
    if (!d) { renderColdView(container); return; }
    const now = Date.now();
    // 30초 이상 된 어림 위치는 만료
    if (now - d.t > 30000) { degradedPos = null; renderColdView(container); return; }
    // 한글 입력 중이면 다시 그리지 않음 (IME 조합 보호)
    const searchFocused = document.activeElement && document.activeElement.id === 'cold-search';
    if (searchFocused && lastRender && lastRender.degraded) return;
    const radiusM = Math.max(searchRadius, d.acc * 2);
    // 단지 단위로 묶어서 거리순 정렬 (행 단위가 아닌 단지 단위)
    degradedNameList = complexNames()
      .map(n => ({ name: n, d: complexMinDist(n, d.lat, d.lon) }))
      .filter(h => h.d <= radiusM)
      .sort((a, b) => a.d - b.d || a.name.localeCompare(b.name, 'ko'))
      .map(h => h.name);
    const prevQ = (document.getElementById('cold-search') || {}).value || '';
    let html = '';
    html += `<div class="cold-status">📶 어림 위치 (±${Math.round(d.acc)}m) — 정확도가 낮아 참고용으로 표시됩니다</div>`;
    if (!degradedNameList.length) {
      html += `<div class="cold-status">주변 ${Math.round(radiusM)}m 내 단지가 없습니다. 반경을 넓혀보세요.</div>`;
    } else {
      html += `<div class="cold-sec">📶 어림 위치 근처 단지 (${degradedNameList.length}개)</div><div class="chip-row">` +
        degradedNameList.slice(0, 20).map((n, i) => `<button class="chip" onclick="pickDegraded(${i})">${esc(n)}</button>`).join('') + `</div>`;
    }
    html += `<div class="cold-sec">단지 검색</div><input type="text" id="cold-search" placeholder="단지명 입력" autocomplete="off" value="${esc(prevQ)}" oninput="coldSearch(this.value)"><div id="cold-search-res" class="chip-row" style="margin-top:6px;"></div>`;
    container.innerHTML = html;
    if (prevQ) coldSearch(prevQ);
    lastRender = { degraded: true }; lastShown = [];
    updateStatus();
  }
  function renderColdView(container) {
    const v = coldView || { type: 'hybrid' };
    const prevQ = (document.getElementById('cold-search') || {}).value || '';  // 재렌더 시 입력 중인 검색어 유지
    let html = '';
    const hasWifiPosD = Number.isFinite(lastAcc) && lastAcc > 0;
    html += `<div class="cold-status">${v.wpsPending ? '📡 위치 확인 중...' : (hasWifiPosD ? '📡 GPS 없음 · Wi-Fi 어림 위치 수신 중 — 아래에서 단지를 선택하세요' : '📡 GPS 신호 없음 — 아래에서 단지를 선택하세요')}</div>`;
    // 대응 1 (2026-10-17): 1순위 — 직전 지상 위치 근처 단지 원터치 칩 (10분 이내 신뢰 GPS 기준)
    const anchor = loadTrustedGps();
    if (anchor && Date.now() - anchor.t < SANITY_TTL_MS) {
      let bestName = null, bestD = 999999;
      complexNames().forEach(n => {
        const d = dKAvg(n, anchor.lat, anchor.lon).avg;
        if (d < bestD) { bestD = d; bestName = n; }
      });
      if (bestName && bestD <= 500) {
        html += `<div class="cold-sec">📍 직전 위치 근처</div><div class="chip-row">` +
          `<button class="chip chip-anchor" onclick="showComplexRows('${esc(bestName).replace(/'/g, "\\'")}')">📍 ${esc(bestName)} <small>약 ${Math.round(bestD)}m</small></button></div>`;
      }
    }
    coldWpsList = (v.wpsCands || []).slice();
    if (coldWpsList.length) {
      html += `<div class="cold-sec">📶 WiFi 위치 후보</div>`;
      // Sanity Gate에서 점프 의심으로 강등된 경우 경고 배지
      if (v.wpsJumpSuspect) html += `<div class="cold-status" style="color:#c60;">⚠️ Wi-Fi 위치 튐 의심 — 직접 확인 후 선택하세요</div>`;
      else if (Number.isFinite(v.wpsAcc) && v.wpsAcc > WIFI_AUTO_MAX_ACC_M) html += `<div class="cold-status">위치 정확도가 낮아 직접 선택해 주세요</div>`;
      html += `<div class="chip-row">` +
        coldWpsList.map((c, i) => `<button class="chip" onclick="pickWps(${i})">${esc(c.name)} <small>약 ${Math.round(c.d)}m</small></button>`).join('') + `</div>`;
    }
    coldRecentList = getRecents().slice(0, RECENT_CHIP_N);
    if (coldRecentList.length) {
      html += `<div class="cold-sec">최근 방문 단지</div><div class="chip-row">` +
        coldRecentList.map((r, i) => { const sa = shortAddr(r.addr); return `<button class="chip" onclick="pickRecent(${i})">${esc(r.name)}${sa ? ` <small>(${esc(sa)})</small>` : ''}</button>`; }).join('') + `</div>`;
    }
    html += `<div class="cold-sec">단지 검색</div><input type="text" id="cold-search" placeholder="단지명 입력" autocomplete="off" value="${esc(prevQ)}" oninput="coldSearch(this.value)"><div id="cold-search-res" class="chip-row" style="margin-top:6px;"></div>`;
    coldNameList = complexNames().sort((a, b) => a.localeCompare(b, 'ko'));
    html += `<div class="cold-sec">전체 단지 (${coldNameList.length})</div><div class="chip-row">` +
      coldNameList.map((n, i) => `<button class="chip" onclick="pickComplexByIdx(${i})">${esc(n)}</button>`).join('') + `</div>`;
    container.innerHTML = html;
    if (prevQ) coldSearch(prevQ);
    lastRender = { cold: true }; lastShown = [];
    updateStatus();
  }

  // 래치 표시: 콜드/선택/dual(상위 2개 단지)/일반 배지 + 단지 필터
  function renderLatchView(container) {
    if (lastRender && lastRender.latch === latch && lastRender.latchFilter === latchFilter) return;
    const now = Date.now();
    const rank = latch.rank;
    const dual = !!(rank && rank.mode === 'dual' && rank.ordered && rank.ordered.length >= 2);
    let badge;
    if (latch.kind === 'wps') {
      badge = `<div class="latch-badge">📡 위치 기준 (정확도 약 ${latch.wpsAcc}m) <span class="cold-x" onclick="closeColdRestore(event)">✕</span></div>`;
      // 대응 2 (2026-10-17): WPS 오선택 시 1-Tap 전환 바 — 최근 3개 단지 칩
      wpsRecentList = getRecents().slice(0, 3).filter(r => r.name !== (latch.names[0] || ''));
      if (wpsRecentList.length) {
        badge += `<div class="chip-row" style="margin:6px 0;"><span style="font-size:12px;color:#666;">다른 단지:</span>` +
          wpsRecentList.map((r, i) => `<button class="chip" onclick="wpsSwitchRecent(${i})">${esc(r.name)}</button>`).join('') + `</div>`;
      }
    } else if (latch.kind === 'pick') {
      badge = `<div class="latch-badge" onclick="closePickView()">📍 ${esc(latch.names[0] || '')} 전체 동 (터치 시 해제)</div>`;
    } else if (dual) {
      badge = `<div class="latch-badge" onclick="releaseLatch(true)">📡 신호 미약 — 인접 2개 단지 동시 표시 (터치 시 해제)</div>`;
    } else if (latch.names && latch.names.length > 0) {
      const t = latch.names.length > 1 ? '인근 단지 전체 동' : latch.names[0] + ' 전체 동';
      const prefix = latch.kind === 'jump' ? '📡 위치 튐 감지 — ' : '📡 신호 끊김 — ';
      badge = `<div class="latch-badge" onclick="releaseLatch(true)">${prefix}${esc(t)}</div>`;
    } else if (latch.kind === 'jump') {
      badge = `<div class="latch-badge" onclick="releaseLatch(true)">📡 위치 튐 감지 — 확인 중 (터치 시 해제)</div>`;
    } else {
      badge = `<div class="latch-badge" onclick="releaseLatch(true)">[지하 진입 인식] 고정 중 (터치 시 해제)</div>`;
    }
    let chips = '';
    if (dual) {
      chips = `<div class="fchip-row"><button class="fchip${latchFilter == null ? ' active' : ''}" onclick="setLatchFilter(-1)">전체</button>` +
        rank.ordered.map((n, i) => `<button class="fchip${latchFilter === n ? ' active' : ''}" onclick="setLatchFilter(${i})">${esc(n)}</button>`).join('') + `</div>`;
    }
    let items = latch.items;
    if (latchFilter != null) items = items.filter(r => String(r.item.name) === latchFilter);
    let html = badge + chips, curSec = null;
    // WPS 펼침: 펼치기 전 목록 + 접기 버튼(펼치기 있던 자리) + 나머지
    const wpsExpanded = latch.kind === 'wps' && !latch.collapsed && latch.collapsedItems && latch.allItems && latchFilter == null;
    let renderItems = items, splitIdx = -1;
    if (wpsExpanded) {
      const collapsedSet = new Set(latch.collapsedItems);
      const first = latch.allItems.filter(r => collapsedSet.has(r));
      const rest = latch.allItems.filter(r => !collapsedSet.has(r));
      renderItems = first.concat(rest);
      splitIdx = first.length;
    }
    renderItems.forEach((r, idx) => {
      if (wpsExpanded && idx === splitIdx) html += `<button class="wps-expand" onclick="collapseWps()">접기</button>`;
      const n = String(r.item.name);
      if (dual && latchFilter == null && n !== curSec) {
        curSec = n;
        html += `<div class="rank-sec">${rank.ordered.indexOf(n) === 0 ? '🥇 1순위' : '🥈 2순위'} · ${esc(n)}</div>`;
      }
      html += cardHtml(r, false);
    });
    if (latch.kind === 'wps' && latch.collapsed && latch.allItems) {
      const more = latch.allItems.length - latch.items.length;
      if (more > 0) html += `<button class="wps-expand" onclick="toggleWpsExpand()">단지 전체 펼치기</button>`;
    }
    container.innerHTML = html;
    lastRender = { latch, latchFilter };
  }
  function setLatchFilter(i) {
    latchFilter = (i < 0 || !latch || !latch.rank) ? null : (latch.rank.ordered[i] || null);
    lastRender = null;
    refreshDisplay();
  }

  // 운행 모드 렌더링: 거리 1회 계산 → 이탈 지연 필터 → 정렬 → (변화 없으면) 렌더 생략
  function renderMain(container) {
    // 배달 목적지 우선: 페어링 + 매칭된 목적지가 있으면 목적지 섹션 밑에 현재 GPS 결과도 함께 렌더링
    const gpsBox = isDestPriorityActive() ? renderDestPriority(container) : null;
    if (gpsBox) {
      container = gpsBox;
    } else if (container.querySelector('#dest-priority-sec')) {
      lastRender = null;
    }
    const hasFix = Number.isFinite(myLat) && Number.isFinite(myLon);
    if (!isGpsReady && !hasFix) {
      container.innerHTML = `<div id="loading-msg" style="color:#555; text-align:center; margin-top:80px;">📍 현재 위치를 확인 중입니다...</div>`;
      lastRender = null;
      return;
    }
    if (!hasFix && !coldChecked) coldBootCheck();
    if (latch) { renderLatchView(container); return; }
    if (!hasFix && degradedPos) { renderDegradedView(container); return; }
    if (!hasFix && coldView) { renderColdView(container); return; }
    const ref = hasFix ? { lat: myLat, lon: myLon } : getSavedPos();
    usingSavedPos = hasFix ? null : ref;
    if (!ref) { coldView = coldView || { type: 'hybrid', wpsPending: false, wpsCands: [] }; renderColdView(container); return; }

    const now = Date.now();
    const exitR = searchRadius + Math.max(HYST_MIN_M, hasFix && Number.isFinite(myAcc) ? myAcc : 0);
    const scored = allData.map(item => ({ item, k: keyOf(item), d: getDist(item.lat, item.lon, ref.lat, ref.lon) }));
    scored.forEach(s => { if (s.d <= searchRadius) lastInAt.set(s.k, now); });
    lastInAt.forEach((t, k) => { if (now - t > HYST_MS) lastInAt.delete(k); });
    const rows = scored
      .filter(s => s.d <= searchRadius || (shownKeys.has(s.k) && s.d <= exitR && lastInAt.has(s.k)))
      .sort((a, b) => {
        // 신호끊김/약함 지역(정확도 30m 초과)에서만 동 오름차순, 그 외는 거리순
        const weak = Number.isFinite(myAcc) && myAcc > 30;
        if (weak) return (a.item.name || '').localeCompare(b.item.name || '', 'ko') || cmpDong(a.item, b.item);
        return a.d - b.d;
      });
    rows.forEach(r => { r.near = r.d <= searchRadius; });
    const approach = updatePrefetch(scored, rows, now);

    if (hasFix && !suppressNearFx && rows.some(r => r.near && !shownKeys.has(r.k))) onNearEntry();
    shownKeys = new Set(rows.map(r => r.k));
    lastShown = rows;

    const approachKey = approach ? approach.name + '@' + Math.round(approach.d / 10) * 10 : '';
    const sig = [searchRadius, dataVer, approachKey].concat(rows.map(r => r.k + (r.near ? '*' : ''))).join('\u0002');
    if (lastRender && lastRender.sig === sig && distM(lastRender.lat, lastRender.lon, ref.lat, ref.lon) < RENDER_MIN_MOVE) return;
    lastRender = { sig, lat: ref.lat, lon: ref.lon };

    if (rows.length === 0) {
      const hint = approach ? `<div class="approach-hint">접근 중 · ${esc(approach.name)} 약 ${Math.round(approach.d / 10) * 10}m</div>` : '';
      container.innerHTML = `<div style="color:#555; text-align:center; margin-top:50px;">주변 ${searchRadius}m 이내 없음${hint}</div>`;
    } else {
      container.innerHTML = rows.map(r => cardHtml(r, false)).join('');
    }
  }

  // 2단계 지오펜스: 150m 안에 들어온 단지는 동 목록을 미리 정렬·HTML 준비해 둔다
  function updatePrefetch(scored, rows, now) {
    const near = new Map();
    scored.forEach(s => {
      if (s.d > PREFETCH_R) return;
      const n = String(s.item.name);
      if (!near.has(n) || s.d < near.get(n)) near.set(n, s.d);
    });
    near.forEach((d, name) => {
      const pc = prefetch.get(name);
      if (pc) { pc.t = now; return; }
      const list = allData.filter(i => String(i.name) === name)
        .sort((a, b) => String(a.dong).localeCompare(String(b.dong), 'ko', { numeric: true }));
      prefetch.set(name, { t: now, list, html: new Map(list.map(i => [keyOf(i), buildBody(i, false)])) });
    });
    prefetch.forEach((pc, name) => { if (now - pc.t > 60000) prefetch.delete(name); });

    const shownNames = new Set(rows.map(r => String(r.item.name)));
    let best = null;
    near.forEach((d, name) => { if (!shownNames.has(name) && (!best || d < best.d)) best = { name, d }; });
    return best;
  }

  function buildBody(i, manage) {
    const dong = String(i.dong);
    return `<div class="apt-info"><div class="apt-name">${esc(i.name)}</div><div class="apt-dong">${esc(dong)}</div></div><div class="pw-info"><div class="pw-text ${dong.includes("공통") ? 'common' : ''}">${esc(i.pw)}</div>${manage ? `<button class="delete-btn" onclick="deleteData('${esc(i.id)}', event)">삭제</button>` : ''}</div>`;
  }

  function cardHtml(r, manage) {
    const i = r.item;
    const pc = !manage && prefetch.get(String(i.name));
    const body = (pc && pc.html.get(keyOf(i))) || buildBody(i, manage);
    return `<div class="list-item ${r.near ? 'near' : ''}" onclick="showEditModal(${esc(JSON.stringify(i))})">${r.near ? `<span class="dist-tag">${Math.round(r.d)}m</span>` : ''}${body}</div>`;
  }

  // 위도 보정 평면 근사 거리(m)
  function distM(lat1, lon1, lat2, lon2) {
    const dx = (lon2 - lon1) * 111000 * Math.cos(lat1 * Math.PI / 180);
    const dy = (lat2 - lat1) * 111000;
    return Math.hypot(dx, dy);
  }

  // ===== Sanity Gate 헬퍼 (2026-10-17) =====
  // 고신뢰 GPS 판별: BSSID를 브라우저에서 읽을 수 없으므로 휴리스틱 사용
  // - accuracy ≤ 18m: GPS 확정급
  // - accuracy ≤ 30m + 움직임(speed/altitude) 있음: GPS 유력
  // - 그 외 (Wi-Fi 20~60m 단독 등): 저신뢰 → 점프 확정 카운트에서 제외
  function isHighConfidenceGps(c) {
    if (!c || !Number.isFinite(c.accuracy)) return false;
    if (c.accuracy <= 18) return true;
    const hasKinematics = (Number.isFinite(c.speed) && c.speed > 0.5) || Number.isFinite(c.altitude);
    return c.accuracy <= 30 && hasKinematics;
  }
  function loadTrustedGps() {
    try {
      const s = JSON.parse(localStorage.getItem(TRUSTED_GPS_KEY) || 'null');
      if (s && Number.isFinite(s.lat) && Number.isFinite(s.lon) && Number.isFinite(s.t)) return s;
    } catch (e) {}
    return null;
  }
  function saveTrustedGps(lat, lon, acc, t) {
    try { localStorage.setItem(TRUSTED_GPS_KEY, JSON.stringify({ lat, lon, acc, t })); } catch (e) {}
  }
  // 앵커(마지막 신뢰 위치) 대비 물리적 이동 가능 거리 검증
  // isUndergroundOrLatched: 래치 활성 or GPS 에러(지하 유력) 시 true → 250m 상한 캡
  // 반환: { ok, reason, dist, allowedDist }
  function isPlausibleFromAnchor(lat, lon, acc, now, isUndergroundOrLatched) {
    const anchor = lastGood || loadTrustedGps();
    if (!anchor || !Number.isFinite(anchor.lat)) return { ok: true, reason: 'no-anchor' };
    const dtSec = Math.max((now - anchor.t) / 1000, 1);
    if (dtSec * 1000 > SANITY_TTL_MS) return { ok: true, reason: 'expired' };
    const d = distM(anchor.lat, anchor.lon, lat, lon);
    const allowedDist = isUndergroundOrLatched
      ? Math.min(UNDERGROUND_RADIUS_CAP_M, 80 + dtSec * WALK_SPEED_MPS)
      : (100 + dtSec * MAX_SPEED);
    if (d > allowedDist + acc) return { ok: false, reason: 'jump-exceeded', dist: Math.round(d), allowedDist: Math.round(allowedDist) };
    return { ok: true, dist: Math.round(d) };
  }

  function getDist(latStr, lonStr, refLat = myLat, refLon = myLon) {
    if (!latStr || !Number.isFinite(refLat) || !Number.isFinite(refLon)) return 999999;
    const lats = String(latStr).split('|'), lons = String(lonStr).split('|'); let minD = 999999;
    lats.forEach((lt, idx) => {
      const a = parseFloat(lt), o = parseFloat(lons[idx]);
      if (!Number.isFinite(a) || !Number.isFinite(o)) return;
      const d = distM(refLat, refLon, a, o);
      if (d < minD) minD = d;
    });
    return minD;
  }
  
  function deleteData(id, event) { 
    event.stopPropagation(); 
    if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(id))) { showMsg('잘못된 요청입니다.'); return; }
    if (navigator.vibrate) { navigator.vibrate([200, 100, 200]); }
    
    showMsg("데이터가 완전히 삭제됩니다.\n보안 비밀번호(4자리)를 입력해 주십시오.", async (pw) => {
      if(!pw) { showMsg("비밀번호 검증이 취소되었습니다."); return; }
      try {
        const res = await fetch(SUPABASE_URL + '/functions/v1/apt-admin', { method: 'POST', headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw, id }) });
        const j = await res.json();
        showMsg(j.msg); if (j.success) loadData();
      } catch (e) { showMsg('삭제 요청 실패: 네트워크 오류'); }
    }, true, true);
  }
  
  // 좌표 입력 검증: 빈 쌍 제거, 위도 -90~90 / 경도 -180~180, 위도·경도 개수 일치
  function collectCoords() {
    const lats = [], lons = [];
    const latEls = document.querySelectorAll('.lat-val'), lonEls = document.querySelectorAll('.lon-val');
    if (latEls.length !== lonEls.length) return { err: "위도와 경도의 개수가 일치하지 않습니다." };
    for (let idx = 0; idx < latEls.length; idx++) {
      const a = latEls[idx].value.trim(), o = lonEls[idx].value.trim();
      if (!a && !o) continue;
      if (!a || !o) return { err: "위도와 경도는 쌍으로 입력해야 합니다." };
      const la = Number(a), lo = Number(o);
      if (!Number.isFinite(la) || la < -90 || la > 90) return { err: "위도 값이 올바르지 않습니다 (-90 ~ 90):\n" + a };
      if (!Number.isFinite(lo) || lo < -180 || lo > 180) return { err: "경도 값이 올바르지 않습니다 (-180 ~ 180):\n" + o };
      lats.push(a); lons.push(o);
    }
    return { lat: lats.join('|'), lon: lons.join('|') };
  }

  // 주소 → 좌표 (기존 GAS 서버측 Maps.newGeocoder 대체)
  async function geocodeAddr(addr) {
    const q = addr.includes('포항') ? addr : '경상북도 포항시 ' + addr;
    try {
      const res = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=' + encodeURIComponent(q));
      const j = await res.json();
      return (j && j[0]) ? { lat: j[0].lat, lon: j[0].lon } : null;
    } catch (e) { return null; }
  }

  async function saveData() {
    const c = collectCoords();
    if (c.err) { showMsg(c.err); return; }
    const d = { id: document.getElementById('edit-row').value, name: document.getElementById('in-name').value, dong: document.getElementById('in-dong').value, pw: document.getElementById('in-pw').value, addr: collectAddrs(), lat: c.lat, lon: c.lon, note: document.getElementById('in-note').value };
    if ((!d.lat || !d.lon) && d.addr) {
      const g = await geocodeAddr(d.addr);
      if (g) { d.lat = g.lat; d.lon = g.lon; }
    }
    const payload = { apt_name: d.name, dong_line: d.dong, password: d.pw, address: d.addr, lat: d.lat, lng: d.lon, notes: d.note };
    const editId = document.getElementById('edit-row').value;
    const q = editId ? sb.from('apt_passwords').update(payload).eq('id', editId) : sb.from('apt_passwords').insert([payload]);
    const { error } = await q;
    if (error) { showMsg('저장 실패: ' + error.message); return; }
    hideInputModal(); loadData(); showMsg('성공적으로 저장되었습니다!');
  }
  
  function addAddrRow(val = "") {
    const container = document.getElementById('addr-container');
    const div = document.createElement('div'); div.className = 'addr-row'; div.style.cssText = 'display:flex;gap:5px;margin-bottom:5px;';
    div.innerHTML = `<input type="text" class="addr-val" placeholder="주소" autocomplete="off" value="${esc(val)}" style="flex:1;"><button type="button" class="row-btn" style="color:var(--error);" onclick="this.parentElement.remove()">-</button>`;
    container.appendChild(div);
  }
  function collectAddrs() {
    const vals = [...document.querySelectorAll('.addr-val')].map(el => el.value.trim()).filter(v => v);
    return vals.join(' / ');
  }
  function addGpsRow(lat = "", lon = "") {
    const container = document.getElementById('gps-container');
    const isFirst = container.children.length === 0;
    const div = document.createElement('div'); div.className = 'gps-row';
    let buttons = isFirst ? `<button type="button" class="row-btn" style="color:var(--error);" onclick="removeLastGpsRow()">-</button><button type="button" class="row-btn" style="color:var(--accent);" onclick="addGpsRow()">+</button>` : `<div style="width:45px;"></div><div style="width:45px;"></div>`;
    div.innerHTML = `<input type="text" class="lat-val" placeholder="위도" autocomplete="off" value="${esc(lat)}"><input type="text" class="lon-val" placeholder="경도" autocomplete="off" value="${esc(lon)}">${buttons}`;
    container.appendChild(div);
  }
  function removeLastGpsRow() { const rows = document.querySelectorAll('.gps-row'); if (rows.length > 1) { rows[rows.length - 1].remove(); } else { showMsg("최소 1개의 좌표는 필요합니다."); } }
  function setAccMsg(text, color) { const el = document.getElementById('gps-acc-msg'); el.textContent = text; el.style.color = color || '#999'; }
  function getGPS() {
    if (!navigator.geolocation) { setAccMsg("이 기기에서는 위치를 사용할 수 없습니다.", "var(--error)"); return; }
    setAccMsg("📡 위치 측정 중... (최대 15초)");
    navigator.geolocation.getCurrentPosition(p => {
      const rows = document.querySelectorAll('.gps-row'); const lastRow = rows[rows.length - 1]; const latIn = lastRow.querySelector('.lat-val'); const lonIn = lastRow.querySelector('.lon-val');
      if (latIn.value || lonIn.value) { addGpsRow(p.coords.latitude, p.coords.longitude); } else { latIn.value = p.coords.latitude; lonIn.value = p.coords.longitude; }
      const acc = Math.round(p.coords.accuracy);
      if (acc > 20) setAccMsg(`측정 정확도 ±${acc}m\n⚠️ 정확도 낮음, 출입구 앞에서 재측정 권장`, "var(--error)");
      else setAccMsg(`측정 정확도 ±${acc}m`, "var(--accent)");
    }, err => {
      const msg = { 1: "위치 권한이 거부되었습니다.\n설정에서 위치 권한을 허용해 주세요.", 2: "현재 위치를 확인할 수 없습니다.\n실외·출입구 앞에서 다시 시도해 주세요.", 3: "위치 측정 시간이 초과되었습니다(15초).\n다시 시도해 주세요." }[err && err.code] || "위치를 가져오지 못했습니다.";
      setAccMsg(msg, "var(--error)");
      showMsg(msg);
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  }
  function showAddModal() { ['edit-row','in-name','in-dong','in-pw','in-note'].forEach(id => document.getElementById(id).value = ""); document.getElementById('addr-container').innerHTML = ""; addAddrRow(); document.getElementById('gps-container').innerHTML = ""; setAccMsg(""); addGpsRow(); document.getElementById('input-modal').style.display = 'block'; }
  function showEditModal(i) {
    setAccMsg("");
    document.getElementById('edit-row').value = i.id || ''; document.getElementById('in-name').value = i.name; document.getElementById('in-dong').value = i.dong; document.getElementById('in-pw').value = i.pw;
    document.getElementById('in-note').value = i.note;
    const addrContainer = document.getElementById('addr-container'); addrContainer.innerHTML = "";
    const addrs = String(i.addr || '').split(' / ').map(s => s.trim()).filter(s => s);
    if (addrs.length === 0) addAddrRow(); else addrs.forEach(a => addAddrRow(a));
    const container = document.getElementById('gps-container'); container.innerHTML = "";
    const lats = String(i.lat).split('|'), lons = String(i.lon).split('|');
    lats.forEach((lt, idx) => addGpsRow(lt, lons[idx] || ""));
    if (lats.length === 0) addGpsRow();
    document.getElementById('input-modal').style.display = 'block';
  }
  function hideInputModal() { document.getElementById('input-modal').style.display = 'none'; }
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').then(function(reg) {
      // 새 SW가 설치되면 자동으로 교체하고 새로고침 (수동 업데이트 불필요)
      reg.addEventListener('updatefound', function() {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function() {
          if (nw.state === 'activated' && navigator.serviceWorker.controller && !window.__swReloaded) {
            window.__swReloaded = true;
            location.reload();
          }
        });
      });
    });
  });
  // 대기 중이던 새 SW가 제어권을 가져가면 새로고침
  navigator.serviceWorker.addEventListener('controllerchange', function() {
    if (!window.__swReloaded) { window.__swReloaded = true; location.reload(); }
  });
}
</script>
